# Local stand-in for the Kubernetes ingress: /v1 goes to the backend, everything else
# goes through Anubis (which proxies to the frontend).
server {
    listen 80;
    client_max_body_size 2m;

    # The frontend and backend send their own headers (incl. CSP); these also cover the Anubis
    # challenge pages. Same values as frontend/security-headers.conf; proxied copies are dropped first.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /v1/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # Fake Mollie checkout of the `mock-mollie` service (profile `mock`); it listens in the backend's network namespace
    location /mock-mollie/ {
        proxy_pass http://backend:9200/;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://anubis:8923;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
