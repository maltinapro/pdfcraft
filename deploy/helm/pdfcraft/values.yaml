image:
  registry: ghcr.io/maltinapro
  # Empty = the chart's appVersion (set to the image tag when the chart is released)
  tag: ""
  pullPolicy: Always

backend:
  replicaCount: 1
  # Name of a Secret with the key STRIPE_WEBHOOK_SECRET (only needed for purchased tokens,
  # together with backend.env.PAID_TOKENS_ENABLED="true"; see docs/12-paid-tokens-stripe.md)
  stripeSecret: ""
  env:
    MAX_CONCURRENT_COMPILES: "2"
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }

# Tokens and rate limits. Single replica with a persistent volume (append-only file).
# For HA use a Valkey operator instead: set enabled=false and backend.env.VALKEY_URL.
valkey:
  enabled: true
  image: valkey/valkey:8-alpine
  persistence:
    size: 1Gi
    storageClass: ""
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }

# Proof-of-work in front of the configurator; the backend only issues a free token to
# browsers holding a pass signed by this instance. Generate the key pair with
# `pdfcraft-backend anubis-keygen` (private key: Secret, public key: backend).
anubis:
  enabled: true
  image: ghcr.io/techarohq/anubis:v1.28.2
  replicaCount: 1
  difficulty: 4
  cookieExpiration: 12h
  privateKeyHex: ""
  # Alternatively an existing Secret with the key ED25519_PRIVATE_KEY_HEX
  existingSecret: ""
  publicKeyHex: ""
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }

# Monitoring (all optional; needs the Prometheus Operator CRDs for the resources below).
# The metrics ports are container ports only: no Service port, no Ingress route.
metrics:
  port: 9090
  anubisPort: 9091
  podMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    # Extra labels, e.g. `release: kube-prometheus-stack` if your Prometheus selects by label
    labels: {}
  # Alert rules (backend down, 5xx rate, slow PDFs, Valkey errors, saturated compile slots)
  prometheusRule:
    enabled: false
    labels: {}

frontend:
  replicaCount: 1
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { cpu: 200m, memory: 64Mi }

ingress:
  enabled: true
  className: traefik
  host: ""
  tls:
    enabled: true
    secretName: pdfcraft-tls
  # Name of a cert-manager ClusterIssuer that exists on the cluster
  clusterIssuer: letsencrypt-prod
  annotations: {}
