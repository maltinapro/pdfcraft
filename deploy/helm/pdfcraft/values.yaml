image:
  registry: ghcr.io/maltinapro
  # Empty = the chart's appVersion (set to the image tag when the chart is released)
  tag: ""
  pullPolicy: Always

backend:
  replicaCount: 1
  # Name of a Secret with the key STRIPE_WEBHOOK_SECRET (only needed for purchased tokens,
  # together with backend.env.PAID_TOKENS_ENABLED="true"; see docs/12-paid-tokens-stripe.md)
  stripeSecret: ""
  # Name of a Secret with the key VALKEY_URL (e.g. redis://:PASSWORD@host:6379, rediss:// for TLS).
  # Use with valkey.enabled=false when an operator-managed Valkey requires authentication.
  valkeySecret: ""
  env:
    MAX_CONCURRENT_COMPILES: "2"
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }

# Tokens and rate limits. Single replica with a persistent volume (append-only file).
# For HA use a Valkey operator instead: set enabled=false and backend.env.VALKEY_URL.
valkey:
  enabled: true
  image: valkey/valkey:8-alpine
  persistence:
    size: 1Gi
    storageClass: ""
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }

# Proof-of-work in front of the configurator; the backend only issues a free token to
# browsers holding a pass signed by this instance. Generate the key pair with
# `pdfcraft-backend anubis-keygen` (both end up in one Secret).
anubis:
  enabled: true
  image: ghcr.io/techarohq/anubis:v1.28.2
  replicaCount: 1
  difficulty: 4
  # Valkey URL for Anubis' challenge store (shared between pods, survives restarts). Empty = the
  # chart's Valkey; required when valkey.enabled=false. May contain a password (stored in a Secret).
  storeUrl: ""
  # true when that Valkey runs in cluster mode (sharded; Anubis logs "MOVED ..." otherwise)
  storeCluster: false
  cookieExpiration: 12h
  privateKeyHex: ""
  publicKeyHex: ""
  # Alternatively one existing Secret with the keys ED25519_PRIVATE_KEY_HEX and
  # ANUBIS_PUBLIC_KEY_HEX (then privateKeyHex/publicKeyHex stay empty)
  existingSecret: ""
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }

# Monitoring (all optional; needs the Prometheus Operator CRDs for the resources below).
# The metrics ports are container ports only: no Service port, no Ingress route.
metrics:
  port: 9090
  anubisPort: 9091
  podMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    # Extra labels, e.g. `release: kube-prometheus-stack` if your Prometheus selects by label
    labels: {}
  # Alert rules (backend down, 5xx rate, slow PDFs, Valkey errors, saturated compile slots)
  prometheusRule:
    enabled: false
    labels: {}

# Grafana dashboards (dashboards/*.json in this chart). Optional.
# mode "operator": GrafanaDashboard resources (grafana.integreatly.org/v1beta1, needs the operator's CRDs)
# mode "sidecar":   labelled ConfigMaps picked up by the Grafana dashboard sidecar (k8s-sidecar)
grafana:
  dashboards:
    enabled: false
    mode: operator
    # Only for mode "sidecar": must match the sidecar's label/labelValue/folderAnnotation settings
    sidecar:
      label: grafana_dashboard
      labelValue: "1"
      folderAnnotation: grafana_folder
    folder: PDFCraft
    resyncPeriod: 10m
    # Needed if the Grafana instance lives in another namespace than this release
    allowCrossNamespaceImport: true
    # Must match the labels of your Grafana custom resource
    instanceSelector:
      matchLabels:
        dashboards: grafana
    labels: {}

frontend:
  replicaCount: 1
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { cpu: 200m, memory: 64Mi }

ingress:
  enabled: true
  className: traefik
  host: ""
  tls:
    enabled: true
    secretName: pdfcraft-tls
  # Name of a cert-manager ClusterIssuer that exists on the cluster
  clusterIssuer: letsencrypt-prod
  annotations: {}
