image:
  registry: ghcr.io/maltinapro
  tag: latest
  pullPolicy: Always

backend:
  replicaCount: 1
  env:
    ENABLE_GENERATE_PDF: "true"
    MAX_CONCURRENT_COMPILES: "2"
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }

frontend:
  replicaCount: 1
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { cpu: 200m, memory: 64Mi }

ingress:
  enabled: true
  className: traefik
  host: ""
  tls:
    enabled: true
    secretName: pdfcraft-tls
  # Name of a cert-manager ClusterIssuer that exists on the cluster
  clusterIssuer: letsencrypt-prod
  annotations: {}
