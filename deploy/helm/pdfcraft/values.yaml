image:
  registry: ghcr.io/maltinapro
  # Empty = the chart's appVersion (set to the image tag when the chart is released)
  tag: ""
  pullPolicy: Always

backend:
  replicaCount: 1
  env:
    ENABLE_GENERATE_PDF: "true"
    MAX_CONCURRENT_COMPILES: "2"
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }

# Tokens and rate limits. Single replica with a persistent volume (append-only file).
# For HA use a Valkey operator instead: set enabled=false and backend.env.VALKEY_URL.
valkey:
  enabled: true
  image: valkey/valkey:8-alpine
  persistence:
    size: 1Gi
    storageClass: ""
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }

frontend:
  replicaCount: 1
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { cpu: 200m, memory: 64Mi }

ingress:
  enabled: true
  className: traefik
  host: ""
  tls:
    enabled: true
    secretName: pdfcraft-tls
  # Name of a cert-manager ClusterIssuer that exists on the cluster
  clusterIssuer: letsencrypt-prod
  annotations: {}
