# Prefix of all resource names (default: the release name). Set it when this chart is a dependency of
# another chart whose resources would otherwise get the same names (<release>-backend, ...).
fullnameOverride: ""

image:
  registry: ghcr.io/maltinapro
  # Empty = the chart's appVersion (set to the image tag when the chart is released)
  tag: ""
  pullPolicy: Always

# Schedule all pods on matching nodes (e.g. { kubernetes.io/arch: arm64 }); each component
# (backend, frontend, anubis, valkey) can override it with its own `nodeSelector`.
nodeSelector: {}

# Hardening for the backend and frontend pods (the images run as UID 10001 / 101). The Valkey image
# starts as root and drops privileges itself, so it is left alone.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile: { type: RuntimeDefault }
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: [ALL] }

backend:
  replicaCount: 1
  nodeSelector: {}
  # Name of a Secret with the key MOLLIE_API_KEY (only needed for purchased tokens, together with
  # backend.env.PAID_TOKENS_ENABLED="true", PUBLIC_URL, MOLLIE_REDIRECT_URL and PAID_PRICES;
  # see docs/12-paid-tokens-mollie.md)
  mollieSecret: ""
  # Name of a Secret with the keys INTERNETMARKE_CLIENT_ID and INTERNETMARKE_CLIENT_SECRET (app
  # credentials of the DHL developer portal). Only needed together with
  # backend.env.INTERNETMARKE_ENABLED="true"; see docs/14-internetmarke-integration.md
  # Optional keys INTERNETMARKE_SANDBOX_USERNAME/_PASSWORD: shared test Portokasse login for free tokens
  # (together with backend.env.INTERNETMARKE_SANDBOX_SHIPPING_URL).
  internetmarkeSecret: ""
  # Name of a Secret with the key VALKEY_URL (e.g. redis://:PASSWORD@host:6379; rediss:// is not supported by the backend build).
  # Use with valkey.enabled=false when an operator-managed Valkey requires authentication.
  valkeySecret: ""
  # Name of a Secret with the key `service-tokens`: static service tokens without expiry, one
  # `<id>:<sha256 hex of the token>:<plan or invoices per minute>` per line, mounted as
  # SERVICE_TOKENS_FILE (see docs/05-tokens-and-rate-limiting.md). They need no Valkey: for a
  # service-only install set valkey.enabled=false and anubis.enabled=false.
  serviceTokensSecret: ""
  env:
    MAX_CONCURRENT_COMPILES: "2"
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }
  # Horizontal Pod Autoscaler (CPU; the utilization is relative to resources.requests.cpu). When enabled,
  # replicaCount is ignored. Compilation is CPU bound, so CPU is the signal to scale on.
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    # Optional HPA `behavior` (e.g. a scale-down stabilization window)
    behavior: {}
  # Keeps pods available during node drains. minAvailable 1 blocks draining a node with a single replica:
  # use it with replicaCount >= 2 (or autoscaling.minReplicas >= 2). `maxUnavailable` wins when set.
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
    maxUnavailable: ""
  # Prefer different nodes for the replicas (soft constraint, never blocks scheduling)
  spreadAcrossNodes: false

# Restricts traffic to the backend pods (and, with valkey.enabled, to the chart's Valkey). Needs a CNI that
# enforces NetworkPolicy. Off by default.
networkPolicy:
  enabled: false
  # Peers allowed to reach the API port 3000, as NetworkPolicyPeer list, e.g. the ingress controller:
  #   - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } }
  # or the pods of a calling application. Empty = any pod that can reach the Service.
  ingressFrom: []
  # Peers allowed to scrape the metrics port (only with metrics.podMonitor / metrics.serviceMonitor), e.g.
  #   - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
  # Empty = any pod.
  metricsFrom: []
  egress:
    # true: the backend may only reach DNS, the chart's Valkey and the rules in `extra`
    restrict: true
    # Additional NetworkPolicyEgressRule entries, e.g. an external Valkey:
    #   - to: [{ ipBlock: { cidr: 10.0.0.0/24 } }]
    #     ports: [{ port: 6379, protocol: TCP }]
    extra: []

# Tokens and rate limits. Single replica with a persistent volume (append-only file).
# For HA use a Valkey operator instead: set enabled=false and backend.env.VALKEY_URL.
valkey:
  enabled: true
  nodeSelector: {}
  image: valkey/valkey:9-alpine
  persistence:
    size: 1Gi
    storageClass: ""
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }

# Proof-of-work in front of the configurator; the backend only issues a free token to
# browsers holding a pass signed by this instance. Generate the key pair with
# `pdfcraft-backend anubis-keygen` (both end up in one Secret).
anubis:
  enabled: true
  nodeSelector: {}
  image: ghcr.io/techarohq/anubis:v1.28.2
  replicaCount: 1
  difficulty: 4
  # Valkey URL for Anubis' challenge store (shared between pods, survives restarts). Empty = the
  # chart's Valkey; required when valkey.enabled=false. May contain a password (stored in a Secret).
  storeUrl: ""
  # true when that Valkey runs in cluster mode (sharded; Anubis logs "MOVED ..." otherwise)
  storeCluster: false
  cookieExpiration: 12h
  privateKeyHex: ""
  publicKeyHex: ""
  # Alternatively one existing Secret with the keys ED25519_PRIVATE_KEY_HEX and
  # ANUBIS_PUBLIC_KEY_HEX (then privateKeyHex/publicKeyHex stay empty)
  existingSecret: ""
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }

# Monitoring (all optional; needs the Prometheus Operator CRDs for the resources below).
# The metrics ports are container ports only: no Service port, no Ingress route.
metrics:
  port: 9090
  anubisPort: 9091
  podMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    # Extra labels, e.g. `release: kube-prometheus-stack` if your Prometheus selects by label
    labels: {}
  # Alert rules (backend down, 5xx rate, slow PDFs, Valkey errors, saturated compile slots)
  prometheusRule:
    enabled: false
    labels: {}
  # Alternative to podMonitor (do not enable both): a ServiceMonitor scrapes a dedicated ClusterIP Service
  # `<release>-backend-metrics` that only carries the metrics port (the API Service and the Ingress still
  # never expose it).
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}

# Grafana dashboards (dashboards/*.json in this chart). Optional.
# mode "operator": GrafanaDashboard resources (grafana.integreatly.org/v1beta1, needs the operator's CRDs)
# mode "sidecar":   labelled ConfigMaps picked up by the Grafana dashboard sidecar (k8s-sidecar)
grafana:
  dashboards:
    enabled: false
    mode: operator
    # Only for mode "sidecar": must match the sidecar's label/labelValue/folderAnnotation settings
    sidecar:
      label: grafana_dashboard
      labelValue: "1"
      folderAnnotation: grafana_folder
    folder: PDFCraft
    resyncPeriod: 10m
    # Needed if the Grafana instance lives in another namespace than this release
    allowCrossNamespaceImport: true
    # Must match the labels of your Grafana custom resource
    instanceSelector:
      matchLabels:
        dashboards: grafana
    labels: {}

frontend:
  # false for an API-only install (no frontend, no Anubis, no landing page); see values-production.yaml
  enabled: true
  replicaCount: 1
  nodeSelector: {}
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { cpu: 200m, memory: 64Mi }

ingress:
  enabled: true
  className: traefik
  host: ""
  tls:
    enabled: true
    secretName: pdfcraft-tls
  # Name of a cert-manager ClusterIssuer that exists on the cluster
  clusterIssuer: letsencrypt-prod
  annotations: {}
  # Traefik only: creates a Middleware that adds nosniff, Referrer-Policy and Permissions-Policy to every
  # response (needs the Traefik CRDs) and attaches it to the Ingress. The frontend and backend already set
  # their own headers (incl. CSP); this covers the Anubis challenge pages too.
  securityHeaders: false
