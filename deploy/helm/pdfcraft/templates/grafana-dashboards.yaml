{{- if .Values.grafana.dashboards.enabled }}
{{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: {{ $.Release.Name }}-{{ base $path | trimSuffix ".json" | trimPrefix "pdfcraft-" }}
  labels:
    {{- include "pdfcraft.labels" $ | nindent 4 }}
    {{- with $.Values.grafana.dashboards.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  resyncPeriod: {{ $.Values.grafana.dashboards.resyncPeriod }}
  allowCrossNamespaceImport: {{ $.Values.grafana.dashboards.allowCrossNamespaceImport }}
  folder: {{ $.Values.grafana.dashboards.folder | quote }}
  instanceSelector:
    {{- toYaml $.Values.grafana.dashboards.instanceSelector | nindent 4 }}
  json: |
    {{- $.Files.Get $path | nindent 4 }}
{{- end }}
{{- end }}
