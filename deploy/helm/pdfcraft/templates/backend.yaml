{{- if and (not .Values.valkey.enabled) (not .Values.backend.valkeySecret) (not .Values.backend.serviceTokensSecret) (not .Values.backend.env.VALKEY_URL) (not .Values.backend.env.SERVICE_TOKENS) (not .Values.backend.env.SERVICE_TOKENS_FILE) }}
{{- fail "no token source: enable valkey.enabled, or set backend.valkeySecret (external Valkey) or backend.serviceTokensSecret (static service tokens)" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pdfcraft.fullname" . }}-backend
  labels: {{- include "pdfcraft.labels" . | nindent 4 }}
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "pdfcraft.labels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "pdfcraft.labels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      # The backend never talks to the Kubernetes API
      automountServiceAccountToken: false
      {{- if .Values.backend.spreadAcrossNodes }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "pdfcraft.labels" . | nindent 14 }}
              app.kubernetes.io/component: backend
      {{- end }}
      {{- with (.Values.backend.nodeSelector | default .Values.nodeSelector) }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: backend
          image: {{ .Values.image.registry }}/pdfcraft-backend:{{ .Values.image.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - containerPort: 3000
            # Metrics are scraped from the pod (PodMonitor); the Service and Ingress do not expose this port
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
          env:
            - name: METRICS_ADDR
              value: "0.0.0.0:{{ .Values.metrics.port }}"
            {{- if .Values.backend.valkeySecret }}
            - name: VALKEY_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.valkeySecret }}
                  key: VALKEY_URL
            {{- else if .Values.valkey.enabled }}
            - name: VALKEY_URL
              value: redis://{{ include "pdfcraft.fullname" . }}-valkey:6379
            {{- end }}
            {{- if .Values.anubis.enabled }}
            - name: ANUBIS_PUBLIC_KEY_HEX
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.anubis.existingSecret | default (printf "%s-anubis" (include "pdfcraft.fullname" .)) }}
                  key: ANUBIS_PUBLIC_KEY_HEX
            {{- end }}
            {{- if .Values.backend.mollieSecret }}
            - name: MOLLIE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.mollieSecret }}
                  key: MOLLIE_API_KEY
            {{- end }}
            {{- if .Values.backend.internetmarkeSecret }}
            - name: INTERNETMARKE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.internetmarkeSecret }}
                  key: INTERNETMARKE_CLIENT_ID
            - name: INTERNETMARKE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.internetmarkeSecret }}
                  key: INTERNETMARKE_CLIENT_SECRET
            - name: INTERNETMARKE_SANDBOX_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.internetmarkeSecret }}
                  key: INTERNETMARKE_SANDBOX_USERNAME
                  optional: true
            - name: INTERNETMARKE_SANDBOX_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.internetmarkeSecret }}
                  key: INTERNETMARKE_SANDBOX_PASSWORD
                  optional: true
            {{- end }}
            {{- if .Values.backend.serviceTokensSecret }}
            - name: SERVICE_TOKENS_FILE
              value: /etc/pdfcraft/service-tokens/service-tokens
            {{- end }}
            {{- range $k, $v := .Values.backend.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- if .Values.backend.serviceTokensSecret }}
          volumeMounts:
            - name: service-tokens
              mountPath: /etc/pdfcraft/service-tokens
              readOnly: true
          {{- end }}
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 15
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
      {{- if .Values.backend.serviceTokensSecret }}
      volumes:
        - name: service-tokens
          secret:
            secretName: {{ .Values.backend.serviceTokensSecret }}
            items:
              - key: service-tokens
                path: service-tokens
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pdfcraft.fullname" . }}-backend
  labels: {{- include "pdfcraft.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "pdfcraft.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  ports:
    - port: 3000
      targetPort: 3000
