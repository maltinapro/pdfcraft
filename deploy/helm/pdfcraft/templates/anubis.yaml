{{- if .Values.anubis.enabled }}
{{- /* Challenges live in Valkey so that every Anubis pod (and restarts) can verify them */}}
{{- $storeUrl := .Values.anubis.storeUrl | default (ternary (printf "redis://%s-valkey:6379/0" .Release.Name) "" .Values.valkey.enabled) }}
{{- if and (gt (int .Values.anubis.replicaCount) 1) (not $storeUrl) }}
{{- fail "anubis.replicaCount > 1 needs a shared store: set anubis.storeUrl (valkey.enabled=false)" }}
{{- end }}
{{- if not .Values.anubis.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-anubis
  labels: {{- include "pdfcraft.labels" . | nindent 4 }}
type: Opaque
stringData:
  ED25519_PRIVATE_KEY_HEX: {{ required "anubis.privateKeyHex is required (pdfcraft-backend anubis-keygen)" .Values.anubis.privateKeyHex | quote }}
  ANUBIS_PUBLIC_KEY_HEX: {{ required "anubis.publicKeyHex is required (pdfcraft-backend anubis-keygen)" .Values.anubis.publicKeyHex | quote }}
---
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-anubis-policy
  labels: {{- include "pdfcraft.labels" . | nindent 4 }}
type: Opaque
stringData:
  botPolicy.yaml: |
{{ .Files.Get "files/botPolicy.yaml" | indent 4 }}
{{- if $storeUrl }}
    store:
      backend: valkey
      parameters:
        url: {{ $storeUrl | quote }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-anubis
  labels: {{- include "pdfcraft.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.anubis.replicaCount }}
  selector:
    matchLabels:
      {{- include "pdfcraft.labels" . | nindent 6 }}
      app.kubernetes.io/component: anubis
  template:
    metadata:
      annotations:
        checksum/policy: {{ printf "%s%s" (.Files.Get "files/botPolicy.yaml") $storeUrl | sha256sum }}
      labels:
        {{- include "pdfcraft.labels" . | nindent 8 }}
        app.kubernetes.io/component: anubis
    spec:
      containers:
        - name: anubis
          image: {{ .Values.anubis.image }}
          ports:
            - containerPort: 8923
            - name: metrics
              containerPort: {{ .Values.metrics.anubisPort }}
          env:
            - name: METRICS_BIND
              value: ":{{ .Values.metrics.anubisPort }}"
            - name: BIND
              value: ":8923"
            - name: TARGET
              value: http://{{ .Release.Name }}-frontend:80
            - name: DIFFICULTY
              value: {{ .Values.anubis.difficulty | quote }}
            - name: POLICY_FNAME
              value: /etc/anubis/botPolicy.yaml
            # One free token per pass: pass lifetime equals the free token lifetime
            - name: COOKIE_EXPIRATION_TIME
              value: {{ .Values.anubis.cookieExpiration | quote }}
            - name: DYNAMIC_COOKIE_SUFFIX
              value: "false"
            - name: COOKIE_SECURE
              value: "true"
            - name: ED25519_PRIVATE_KEY_HEX
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.anubis.existingSecret | default (printf "%s-anubis" .Release.Name) }}
                  key: ED25519_PRIVATE_KEY_HEX
          volumeMounts:
            - { name: policy, mountPath: /etc/anubis, readOnly: true }
          resources: {{- toYaml .Values.anubis.resources | nindent 12 }}
      volumes:
        - name: policy
          secret:
            secretName: {{ .Release.Name }}-anubis-policy
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-anubis
  labels: {{- include "pdfcraft.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "pdfcraft.labels" . | nindent 4 }}
    app.kubernetes.io/component: anubis
  ports:
    - port: 8923
      targetPort: 8923
{{- end }}
