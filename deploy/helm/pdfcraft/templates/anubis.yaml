{{- if .Values.anubis.enabled }}
{{- if not .Values.frontend.enabled }}
{{- fail "anubis.enabled=true protects the frontend: set frontend.enabled=true or anubis.enabled=false" }}
{{- end }}
{{- /* Challenges live in Valkey so that every Anubis pod (and restarts) can verify them */}}
{{- $storeUrl := .Values.anubis.storeUrl | default (ternary (printf "redis://%s-valkey:6379/0" (include "pdfcraft.fullname" .)) "" .Values.valkey.enabled) }}
{{- if and (gt (int .Values.anubis.replicaCount) 1) (not $storeUrl) }}
{{- fail "anubis.replicaCount > 1 needs a shared store: set anubis.storeUrl (valkey.enabled=false)" }}
{{- end }}
{{- if not .Values.anubis.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pdfcraft.fullname" . }}-anubis
  labels: {{- include "pdfcraft.labels" . | nindent 4 }}
type: Opaque
stringData:
  ED25519_PRIVATE_KEY_HEX: {{ required "anubis.privateKeyHex is required (pdfcraft-backend anubis-keygen)" .Values.anubis.privateKeyHex | quote }}
  ANUBIS_PUBLIC_KEY_HEX: {{ required "anubis.publicKeyHex is required (pdfcraft-backend anubis-keygen)" .Values.anubis.publicKeyHex | quote }}
---
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pdfcraft.fullname" . }}-anubis-policy
  labels: {{- include "pdfcraft.labels" . | nindent 4 }}
type: Opaque
stringData:
  botPolicy.yaml: |
{{ .Files.Get "files/botPolicy.yaml" | indent 4 }}
{{- if $storeUrl }}
    store:
      backend: valkey
      parameters:
        url: {{ $storeUrl | quote }}
{{- if .Values.anubis.storeCluster }}
        cluster: true
{{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pdfcraft.fullname" . }}-anubis
  labels: {{- include "pdfcraft.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.anubis.replicaCount }}
  selector:
    matchLabels:
      {{- include "pdfcraft.labels" . | nindent 6 }}
      app.kubernetes.io/component: anubis
  template:
    metadata:
      annotations:
        checksum/policy: {{ printf "%s%s%v" (.Files.Get "files/botPolicy.yaml") $storeUrl .Values.anubis.storeCluster | sha256sum }}
      labels:
        {{- include "pdfcraft.labels" . | nindent 8 }}
        app.kubernetes.io/component: anubis
    spec:
      {{- with (.Values.anubis.nodeSelector | default .Values.nodeSelector) }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: anubis
          image: {{ .Values.anubis.image }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          ports:
            - containerPort: 8923
            - name: metrics
              containerPort: {{ .Values.metrics.anubisPort }}
          env:
            - name: METRICS_BIND
              value: ":{{ .Values.metrics.anubisPort }}"
            - name: BIND
              value: ":8923"
            # The frontend Service port (80), not the container port (8080)
            - name: TARGET
              value: http://{{ include "pdfcraft.fullname" . }}-frontend:80
            - name: DIFFICULTY
              value: {{ .Values.anubis.difficulty | quote }}
            - name: POLICY_FNAME
              value: /etc/anubis/botPolicy.yaml
            # One free token per pass: pass lifetime equals the free token lifetime
            - name: COOKIE_EXPIRATION_TIME
              value: {{ .Values.anubis.cookieExpiration | quote }}
            - name: DYNAMIC_COOKIE_SUFFIX
              value: "false"
            - name: COOKIE_SECURE
              value: "true"
            - name: ED25519_PRIVATE_KEY_HEX
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.anubis.existingSecret | default (printf "%s-anubis" (include "pdfcraft.fullname" .)) }}
                  key: ED25519_PRIVATE_KEY_HEX
          volumeMounts:
            - { name: policy, mountPath: /etc/anubis, readOnly: true }
          resources: {{- toYaml .Values.anubis.resources | nindent 12 }}
      volumes:
        - name: policy
          secret:
            secretName: {{ include "pdfcraft.fullname" . }}-anubis-policy
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pdfcraft.fullname" . }}-anubis
  labels: {{- include "pdfcraft.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "pdfcraft.labels" . | nindent 4 }}
    app.kubernetes.io/component: anubis
  ports:
    - port: 8923
      targetPort: 8923
{{- end }}
