{{- if and .Values.ingress.enabled .Values.ingress.securityHeaders }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "pdfcraft.fullname" . }}-security-headers
  labels: {{- include "pdfcraft.labels" . | nindent 4 }}
spec:
  headers:
    contentTypeNosniff: true
    referrerPolicy: strict-origin-when-cross-origin
    permissionsPolicy: "camera=(), microphone=(), geolocation=()"
---
{{- end }}
{{- if .Values.ingress.enabled }}
{{- $host := required "ingress.host is required when ingress.enabled=true" .Values.ingress.host }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "pdfcraft.fullname" . }}
  labels: {{- include "pdfcraft.labels" . | nindent 4 }}
  annotations:
    {{- if and .Values.ingress.tls.enabled .Values.ingress.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer | quote }}
    {{- end }}
    {{- if .Values.ingress.securityHeaders }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-{{ include "pdfcraft.fullname" . }}-security-headers@kubernetescrd
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ $host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: {{ include "pdfcraft.fullname" . }}-backend
                port: { number: 3000 }
          {{- if .Values.frontend.enabled }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "pdfcraft.fullname" . }}-{{ if .Values.anubis.enabled }}anubis{{ else }}frontend{{ end }}
                port: { number: {{ if .Values.anubis.enabled }}8923{{ else }}80{{ end }} }
          {{- end }}
{{- end }}
