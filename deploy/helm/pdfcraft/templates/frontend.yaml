{{- if .Values.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pdfcraft.fullname" . }}-frontend
  labels: {{- include "pdfcraft.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "pdfcraft.labels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "pdfcraft.labels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      {{- with (.Values.frontend.nodeSelector | default .Values.nodeSelector) }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: frontend
          image: {{ .Values.image.registry }}/pdfcraft-frontend:{{ .Values.image.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /, port: 8080 }
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            # nginx keeps its pid file and temp files here (read-only root file system)
            - name: tmp
              mountPath: /tmp
          resources: {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pdfcraft.fullname" . }}-frontend
  labels: {{- include "pdfcraft.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "pdfcraft.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  ports:
    - port: 80
      targetPort: 8080
{{- end }}
