[package]
name = "pdfcraft-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
minijinja = "2"
typst = "0.15.1"
typst-pdf = "0.15.1"
typst-as-lib = "0.17.0"
typst-kit = { version = "0.15.1", default-features = false, features = ["scan-fonts", "embedded-fonts"] }
tower-http = { version = "0.7", features = ["cors"] }
base64 = "0.23.1"
lopdf = "0.46.0"
hayro-svg = { version = "0.7", default-features = false }
usvg = { version = "0.47", default-features = false }
resvg = { version = "0.47", default-features = false }
tiny-skia = "0.12"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager", "cluster-async"] }
sha2 = "0.11.1"
rand = "0.10"
ed25519-dalek = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
prometheus-client = "0.25.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form"] }

# Typst is extremely slow unoptimized; keep `cargo run` fast too.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
debug-assertions = false
overflow-checks = false
debug = false

[dev-dependencies]
serde_yaml = "0.9"
