[package]
name = "pdfcraft-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
minijinja = "2"
typst = "0.15.1"
typst-pdf = "0.15.1"
typst-as-lib = { version = "0.17.0", features = ["typst-kit-fonts", "typst-kit-embed-fonts"] }
tower-http = { version = "0.5", features = ["cors"] }
base64 = "0.23.1"
lopdf = "0.46.0"
zip = { version = "2", default-features = false }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
sha2 = "0.11.1"
rand = "0.8"

# Typst is extremely slow unoptimized; keep `cargo run` fast too.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
debug-assertions = false
overflow-checks = false
debug = false
