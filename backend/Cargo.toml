[package]
name = "pdfcraft-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
minijinja = "2"
typst = "0.15.1"
typst-pdf = "0.15.1"
typst-as-lib = "0.17.0"
tower-http = { version = "0.5", features = ["cors"] }
