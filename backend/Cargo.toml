[package]
name = "pdfcraft-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
minijinja = "2"
tectonic = { version = "0.15", default-features = false, features = ["external-harfbuzz", "geturl-reqwest"] }
tower-http = { version = "0.5", features = ["cors"] }
