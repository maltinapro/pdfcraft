# Hand-written parts of the OpenAPI description (texts, shared responses, request examples).
# `backend/src/openapi.rs` merges them into the part that is generated from the Rust code
# (paths, request/response schemas, validation limits, enums). Do not edit docs/openapi.yaml.
info:
  title: digitalrechnung.jetzt API
  version: 1.0.0
  summary: Create invoices and business documents as PDF (with ZUGFeRD / Factur-X or XRechnung data) from plain JSON.
  description: |
    The server holds the templates; clients send only data. All text is validated and escaped by the server,
    so do **not** escape it yourself. Problems of a request are returned together as `400 validation_error`.

    **Authentication.** Every endpoint below needs a token, sent as `Authorization: Bearer <token>` or as
    `X-API-Key: <token>`. Purchased tokens (`pk_…`) create clean documents. Free tokens (`pf_…`) are issued
    to browsers only (they need a solved Anubis challenge) and put an "Entwurf" / "Draft" watermark on every PDF.

    **Rate limit.** Every PDF costs one unit of the token's per-minute limit (`limitPerMinute` of `GET /v1/token`).
    A bulk request costs one unit per entry and is accepted or rejected as a whole. When the limit is reached the
    server answers `429 rate_limited` with a `Retry-After` header (seconds).

    **Errors.** Every error is JSON: `{ "error": "<code>", "details": "<text>" }`. The codes are stable; the
    texts are English and may change.

    **Request size.** Request bodies are limited to 2 MB (`413` above that).

    The request examples are tested against the backend, so they stay valid.
  license:
    name: MIT
    identifier: MIT
  contact:
    name: maltina.pro
    url: https://maltina.pro/
    email: hello@maltina.pro
servers:
- url: https://digitalrechnung.jetzt
  description: Demo / production
- url: http://localhost:3000
  description: Local backend (`cargo run` or `docker compose up`)
security:
- bearerAuth: []
- apiKeyAuth: []
tags:
- name: Invoices
  description: E-invoices (ZUGFeRD / Factur-X, XRechnung) as PDF.
- name: Documents
  description: Credit notes, offers, order confirmations, delivery notes and letters as PDF.
- name: Token
  description: Information about the calling token.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'The token as `Authorization: Bearer <token>`'
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Alternative to the bearer header; the same token.
  headers:
    RetryAfter:
      description: Seconds to wait before the request is repeated.
      schema:
        type: integer
        minimum: 1
    ContentDisposition:
      description: '`attachment; filename="…"` with the suggested file name.'
      schema:
        type: string
  responses:
    Pdf:
      description: The PDF (PDF/A-3b).
      headers:
        Content-Disposition:
          $ref: '#/components/headers/ContentDisposition'
      content:
        application/pdf:
          schema:
            type: string
            contentMediaType: application/pdf
            contentEncoding: binary
    Zip:
      description: A ZIP archive with one PDF per entry, in the order of the request.
      headers:
        Content-Disposition:
          $ref: '#/components/headers/ContentDisposition'
      content:
        application/zip:
          schema:
            type: string
            contentMediaType: application/zip
            contentEncoding: binary
    BadRequest:
      description: |
        The request is invalid. `validation_error`: `details` lists all problems with their paths, separated
        by `; `. `invalid_request`: malformed JSON, unknown `type`, or an empty or too large bulk list.
        `invalid_asset`: the logo is not valid base64 or too large.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            validation:
              value:
                error: validation_error
                details: 'invoice.recipient.name: is required; invoice.items[0].taxRate: must be one of: 19, 7, 0'
            bulk:
              value:
                error: invalid_request
                details: '`invoices` needs 1 to 25 entries'
    Unauthorized:
      description: The token is missing, invalid, expired or revoked.
      headers:
        WWW-Authenticate:
          description: Always `Bearer`.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unauthorized
            details: 'missing, invalid or expired token (use `Authorization: Bearer <token>` or `X-API-Key`)'
    TooLarge:
      description: The request body is larger than 2 MB (`invalid_request`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: 'The request has no `Content-Type: application/json` header (`invalid_request`).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unprocessable:
      description: |
        `invalid_request`: the JSON is well-formed but a required field (for example `settings` or `invoice`)
        is missing or has the wrong type. `typst_compile_error`: the template could not be compiled; this
        should not happen with validated input, please report it.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: The per-minute limit of the token is reached (`rate_limited`). Repeat the request after `Retry-After` seconds.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: rate_limited
            details: rate limit of 30 invoices per minute reached
    ServerError:
      description: An internal error (`task_join_error`, `zip_error`). Repeat the request; report it if it persists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: |
        `store_unavailable`: the token store is not reachable. `server_busy`: all compile slots stayed busy,
        repeat the request after `Retry-After` seconds.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: server_busy
            details: all compile slots are busy, please retry shortly
errorCodes:
- validation_error
- invalid_request
- invalid_asset
- unauthorized
- rate_limited
- store_unavailable
- server_busy
- typst_compile_error
- template_parse_error
- template_render_error
- task_join_error
- zip_error
