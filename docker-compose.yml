services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Tokens and rate limits live in Valkey
      VALKEY_URL: redis://valkey:6379
      # Comma-separated browser origins; unset = any
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # Set to false in production if only /v1 is needed
      ENABLE_GENERATE_PDF: ${ENABLE_GENERATE_PDF:-true}
      # Feature flag for purchased tokens (off by default)
      PAID_TOKENS_ENABLED: ${PAID_TOKENS_ENABLED:-false}
    depends_on:
      - valkey
  frontend:
    build:
      context: ./frontend
      args:
        # URL of the backend as seen from the browser
        VITE_API_BASE_URL: http://localhost:3000
    ports:
      - "8080:80"
    depends_on:
      - backend

  valkey:
    image: valkey/valkey:8-alpine
    # Append-only file: tokens survive restarts
    command: ["valkey-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - valkeydata:/data

volumes:
  valkeydata:
