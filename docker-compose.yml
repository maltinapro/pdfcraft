services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Tokens and rate limits live in Valkey
      VALKEY_URL: redis://valkey:6379
      # Comma-separated browser origins; unset = any
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # Public key of the Anubis instance below (local defaults; generate your own with
      # `pdfcraft-backend anubis-keygen` and never reuse these)
      ANUBIS_PUBLIC_KEY_HEX: ${ANUBIS_PUBLIC_KEY_HEX:-03cadd7f9e7ce61b77ce911666f5186dc5b45b9a72e1d3d423bed269033a7e38}
      ANUBIS_COOKIE_NAME: techaro.lol-anubis-auth
      # Feature flag for purchased tokens (off by default)
      PAID_TOKENS_ENABLED: ${PAID_TOKENS_ENABLED:-false}
      MOLLIE_API_KEY: ${MOLLIE_API_KEY:-}
      # Empty = the real Mollie API; the `mock` profile sets it to the mock below
      MOLLIE_API_URL: ${MOLLIE_API_URL:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      MOLLIE_REDIRECT_URL: ${MOLLIE_REDIRECT_URL:-}
      PAID_PRICES: ${PAID_PRICES:-}
      PAID_PLANS: ${PAID_PLANS:-}
      # Feature flag: buying Deutsche Post stamps with the user's own Portokasse (off by default)
      INTERNETMARKE_ENABLED: ${INTERNETMARKE_ENABLED:-false}
      INTERNETMARKE_CLIENT_ID: ${INTERNETMARKE_CLIENT_ID:-}
      INTERNETMARKE_CLIENT_SECRET: ${INTERNETMARKE_CLIENT_SECRET:-}
      # Empty = the Deutsche Post production URLs; set them for the sandbox or the mock below
      INTERNETMARKE_SHIPPING_URL: ${INTERNETMARKE_SHIPPING_URL:-}
      INTERNETMARKE_PRODUCTS_URL: ${INTERNETMARKE_PRODUCTS_URL:-}
      # Optional test API for free tokens (draft watermark), see docs/14-internetmarke-integration.md
      INTERNETMARKE_SANDBOX_SHIPPING_URL: ${INTERNETMARKE_SANDBOX_SHIPPING_URL:-}
      INTERNETMARKE_SANDBOX_USERNAME: ${INTERNETMARKE_SANDBOX_USERNAME:-}
      INTERNETMARKE_SANDBOX_PASSWORD: ${INTERNETMARKE_SANDBOX_PASSWORD:-}
    depends_on:
      - valkey
  frontend:
    build:
      # Repository root: the build publishes docs/openapi.yaml
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Same origin: the edge proxy routes /v1 to the backend
        VITE_API_BASE_URL: ""
    depends_on:
      - backend

  # Proof-of-work challenge in front of the configurator (/app). Solving it yields a signed
  # cookie, which the backend requires before it issues a free token.
  anubis:
    image: ghcr.io/techarohq/anubis:latest
    environment:
      BIND: ":8923"
      TARGET: http://frontend:80
      DIFFICULTY: "4"
      POLICY_FNAME: /etc/anubis/botPolicy.yaml
      # Local defaults, see ANUBIS_PUBLIC_KEY_HEX above
      ED25519_PRIVATE_KEY_HEX: ${ANUBIS_PRIVATE_KEY_HEX:-ae8b4a3f41d401839428b53c984f84e27ca9ecacbb1e60fc43181db5082d21fd}
      # A pass is valid as long as a free token (12 h): one free token per solved challenge
      COOKIE_EXPIRATION_TIME: 12h
      DYNAMIC_COOKIE_SUFFIX: "false"
      # Plain HTTP on localhost
      COOKIE_SECURE: "false"
      COOKIE_PARTITIONED: "false"
    volumes:
      - ./deploy/anubis/botPolicy.yaml:/etc/anubis/botPolicy.yaml:ro

  # Local stand-in for the ingress
  edge:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/compose/edge.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - anubis

  # Local stand-in for the Deutsche Post Internetmarke APIs (development only, off by default):
  #   INTERNETMARKE_ENABLED=true INTERNETMARKE_CLIENT_ID=id INTERNETMARKE_CLIENT_SECRET=secret \
  #   INTERNETMARKE_SHIPPING_URL=http://127.0.0.1:9100/im/v1 \
  #   INTERNETMARKE_PRODUCTS_URL=http://127.0.0.1:9100/products \
  #   docker compose --profile mock up --build
  # It shares the backend's network namespace because the backend only accepts plain http for
  # loopback addresses. Portokasse login: any e-mail with the password `secret`.
  mock-post:
    profiles: ["mock"]
    image: python:3-alpine
    network_mode: "service:backend"
    command: ["python3", "/mock/mock_internetmarke.py", "9100"]
    volumes:
      - ./backend/tools/mock_internetmarke.py:/mock/mock_internetmarke.py:ro
    depends_on:
      - backend

  # Local stand-in for the Mollie API incl. a fake checkout page (development only, off by default):
  #   docker compose --env-file deploy/compose/mock-mollie.env --profile mock up --build
  # Like mock-post it shares the backend's network namespace (plain http only for loopback);
  # the edge proxy publishes its checkout pages at http://localhost:8080/mock-mollie/.
  mock-mollie:
    profiles: ["mock"]
    image: python:3-alpine
    network_mode: "service:backend"
    environment:
      MOCK_MOLLIE_HOST: 0.0.0.0
      MOCK_MOLLIE_PUBLIC_URL: ${MOCK_MOLLIE_PUBLIC_URL:-http://localhost:8080/mock-mollie}
    command: ["python3", "/mock/mock_mollie.py", "9200"]
    volumes:
      - ./backend/tools/mock_mollie.py:/mock/mock_mollie.py:ro
    depends_on:
      - backend

  valkey:
    image: valkey/valkey:9-alpine
    # Append-only file: tokens survive restarts
    command: ["valkey-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - valkeydata:/data

volumes:
  valkeydata:
