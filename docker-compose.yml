services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Enables POST /v1/invoices and /v1/invoices/bulk; comma-separated keys
      API_KEYS: ${API_KEYS:-}
      # Optional: API keys in Postgres and a shared rate limit in Redis (e.g. `docker compose --profile shared up`)
      DATABASE_URL: ${DATABASE_URL:-}
      REDIS_URL: ${REDIS_URL:-}
      # Comma-separated browser origins; unset = any
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # Set to false in production if only /v1 is needed
      ENABLE_GENERATE_PDF: ${ENABLE_GENERATE_PDF:-true}
  frontend:
    build:
      context: ./frontend
      args:
        # URL of the backend as seen from the browser
        VITE_API_BASE_URL: http://localhost:3000
    ports:
      - "8080:80"
    depends_on:
      - backend

  postgres:
    profiles: ["shared"]
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pdfcraft}
      POSTGRES_DB: pdfcraft
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    profiles: ["shared"]
    image: redis:7-alpine

volumes:
  pgdata:
