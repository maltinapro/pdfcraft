  /v1/documents/bulk:
    post:
      description: |-
        Renders many documents of one `type` with shared settings and returns a ZIP of PDFs named
        `<type>-<number>.pdf`. Any validation error rejects the whole request and names the entry
        (`documents[2]: …`). The number of documents per request depends on the plan (`bulkMax` of
        `GET /v1/token`). Costs one rate-limit unit per document.
      operationId: createDocumentsBulk
      requestBody:
        content:
          application/json:
            examples:
              offers:
                summary: Two offers
                value:
                  documents:
                  - date: '2026-03-02'
                    items:
                    - description: Webseite
                      price: 2400
                      quantity: 1
                      unit: flat
                    number: A-2026-004
                    recipient:
                      address: Kundenweg 5
                      city: 54321 Kundenstadt
                      name: Kunde AG
                  - date: '2026-03-03'
                    items:
                    - description: Wartung
                      price: 99
                      quantity: 12
                      unit: mo
                    number: A-2026-005
                    recipient:
                      address: Beispielallee 2
                      city: 10115 Berlin
                      name: Beispiel KG
                  settings:
                    sender:
                      address: Musterstr. 1
                      city: 12345 Musterstadt
                      name: Muster GmbH
                  type: offer
            schema:
              $ref: '#/components/schemas/DocumentBulkRequest'
        required: true
      responses:
        '200':
          $ref: '#/components/responses/Zip'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
      summary: Create many documents of one type (ZIP of PDFs)
      tags:
      - Documents
  /v1/einvoices/parse:
    post:
      description: |-
        Stateless: the request body is a ZUGFeRD / Factur-X PDF (`application/pdf`) or an XML file
        (`application/xml`: CII or UBL, XRechnung); the type is detected from the content. The XML of a PDF is
        read from its attachment (`factur-x.xml`, `zugferd-invoice.xml`, `xrechnung.xml`, otherwise the first
        `.xml`). The response is the normalized view of the e-invoice (the same one the browser viewer shows)
        plus the result of a limited plausibility check (mandatory fields, sums, dates, IBAN). It is not a
        validation against EN 16931 or the XRechnung rules (see `notChecked`). Nothing is stored or logged:
        the file only lives in memory while the request runs. PDFs up to 20 MB and XML files up to 5 MB are
        accepted. Costs one rate-limit unit.
      operationId: parseEInvoice
      parameters:
      - description: 'Language of the check texts: `de` or `en` (default `en`).'
        in: query
        name: lang
        required: false
        schema:
          type: string
      - description: |-
          Name of the uploaded XML file; echoed as `fileName` (default `invoice.xml`). Not used for PDFs, which
          report the name of the attachment.
        in: query
        name: fileName
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/pdf:
            schema:
              contentEncoding: binary
              contentMediaType: application/pdf
              type: string
          application/xml:
            schema:
              contentMediaType: application/xml
              type: string
        description: A PDF with an XML attachment, or an XML file.
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                xml:
                  summary: XRechnung / ZUGFeRD XML (CII) with two tax rates
                  value:
                    checks:
                    - findings: []
                      id: header
                      status: ok
                      title: Mandatory header fields (number, date, type, currency, specification)
                    - findings: []
                      id: parties
                      status: ok
                      title: Mandatory seller and buyer details
                    - findings: []
                      id: lines
                      status: ok
                      title: Lines present and complete
                    - findings: []
                      id: line-math
                      status: ok
                      title: Line amount = quantity × unit price (per line, 1 cent rounding tolerance)
                    - findings: []
                      id: line-sum
                      status: ok
                      title: Sum of lines = line total
                    - findings: []
                      id: net-total
                      status: ok
                      title: Net total = lines − allowances + charges
                    - findings: []
                      id: tax-basis
                      status: ok
                      title: Tax basis per category and rate = lines − allowances + charges
                    - findings: []
                      id: tax-amount
                      status: ok
                      title: Tax amount = tax basis × rate (per breakdown, 1 cent rounding tolerance)
                    - findings: []
                      id: tax-total
                      status: ok
                      title: Total tax = sum of the tax amounts
                    - findings: []
                      id: gross-total
                      status: ok
                      title: Gross total = net total + tax
                    - findings: []
                      id: amount-due
                      status: ok
                      title: Amount due = gross total − prepayments + rounding
                    - findings: []
                      id: tax-category
                      status: ok
                      title: Tax categories match the rate, exemption reason present
                    - findings: []
                      id: payment
                      status: ok
                      title: Payment details present, IBAN checksum
                    - findings: []
                      id: dates
                      status: ok
                      title: Dates are real calendar days, due date not before issue date
                    - findings: []
                      id: en16931-rules
                      status: ok
                      title: 'EN 16931 business rules (selection: BR-21, BR-27, BR-61, BR-CO-9/18/25, category rules)'
                    - findings: []
                      id: code-lists
                      status: ok
                      title: 'Code lists: currency, countries, invoice type, tax category, payment means, unit format'
                    fileName: invoice.xml
                    invoice:
                      adjustments: []
                      buyer:
                        city: Kundenstadt
                        country: DE
                        name: Kunde AG
                        postcode: '54321'
                        street: Kundenweg 5
                        vatId: DE987654321
                      buyerReference: 04011000-12345-34
                      currency: EUR
                      deliveryDate: '2026-01-31'
                      dueDate: '2026-03-02'
                      issueDate: '2026-01-31'
                      items:
                      - hasAdjustments: false
                        id: '1'
                        name: Beratung
                        net: 200
                        price: 80
                        priceBasis: 1
                        quantity: 2.5
                        taxCategory: S
                        taxRate: 19
                        unit: HUR
                      - hasAdjustments: false
                        id: '2'
                        name: Innergemeinschaftliche Lieferung
                        net: 40
                        price: 3.333
                        priceBasis: 1
                        quantity: 12
                        taxCategory: E
                        taxRate: 0
                        unit: KGM
                      notes: []
                      number: 2026-001
                      paymentReference: 2026-001
                      payments:
                      - bic: COBADEFFXXX
                        code: '58'
                        iban: DE89370400440532013000
                      precedingInvoices: []
                      profile: urn:cen.eu:en16931:2017
                      seller:
                        city: Musterstadt
                        contactName: Erika Muster
                        country: DE
                        email: rechnung@muster.example
                        name: Muster GmbH
                        phone: +49 30 123456
                        postcode: '12345'
                        street: Musterstr. 1
                        taxNumber: 12/345/67890
                        vatId: DE123456789
                      syntax: cii
                      taxes:
                      - amount: 38
                        basis: 200
                        category: S
                        rate: 19
                      - amount: 0
                        basis: 40
                        category: E
                        exemptionReason: Steuerfrei nach § 4 Nr. 1b UStG
                        rate: 0
                      totals:
                        allowanceTotal: null
                        chargeTotal: null
                        due: 278
                        grandTotal: 278
                        lineTotal: 240
                        prepaid: null
                        rounding: null
                        taxBasis: 240
                        taxTotal: 38
                      typeCode: '380'
                    notChecked:
                    - Validity against the XML schema (XSD)
                    - The remaining business rules of EN 16931 (BR-…) and XRechnung (BR-DE-…); only the selection named above is checked, not the Schematron rules of the KoSIT validator
                    - 'Code lists for units (UN/ECE Rec. 20: format only) and codes outside the listed ones'
                    - PDF/A-3 conformity, XMP metadata and whether the PDF matches the XML
                    - Authenticity, signatures and whether VAT IDs, tax rates or bank details are correct
                    source: xml
              schema:
                $ref: '#/components/schemas/ParseResponse'
          description: The normalized e-invoice and the plausibility check.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/TooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
      summary: Read an e-invoice (PDF or XML) and check it
      tags:
      - E-invoices
  /v1/invoices:
    post:
      description: |-
        Renders one invoice as PDF/A-3b. With `settings.zugferd` (default `true`) the PDF carries the
        e-invoice XML (`factur-x.xml` for `en16931`, `xrechnung.xml` for `xrechnung`). If the data is not
        sufficient for a valid e-invoice, `invoice-draft.xml` is attached instead. Costs one rate-limit unit.
      operationId: createInvoice
      parameters:
      - description: Include PDF zone geometry in `X-Pdfcraft-Zones`; only `1` enables it.
        in: query
        name: zones
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            examples:
              invoice:
                summary: Invoice with two items
                value:
                  invoice:
                    date: '2026-01-31'
                    items:
                    - description: Beratung
                      price: 95
                      quantity: 8
                      taxRate: 19
                      unit: h
                    - description: Fachbuch
                      price: 24.9
                      quantity: 3
                      taxRate: 7
                      unit: pcs
                    number: 2026-001
                    recipient:
                      address: Kundenweg 5
                      city: 54321 Kundenstadt
                      name: Kunde AG
                  settings:
                    bank:
                      bic: COBADEFFXXX
                      iban: DE89370400440532013000
                      name: Musterbank
                    einvoiceProfile: en16931
                    locale: de-de
                    paymentDays: 30
                    sender:
                      address: Musterstr. 1
                      city: 12345 Musterstadt
                      email: rechnung@muster.example
                      name: Muster GmbH
                      vatId: DE123456789
            schema:
              $ref: '#/components/schemas/InvoiceRequest'
        required: true
      responses:
        '200':
          $ref: '#/components/responses/Pdf'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
      summary: Create one invoice (PDF)
      tags:
      - Invoices
  /v1/invoices/bulk:
    post:
      description: |-
        Renders many invoices with shared settings and returns a ZIP with one `invoice-<number>.pdf` per
        invoice. If one invoice is invalid, nothing is returned and the error names the entry
        (`invoices[3]: …`). The number of invoices per request depends on the plan (`bulkMax` of
        `GET /v1/token`); `0` or more than `bulkMax` entries give `400 invalid_request`. Costs one
        rate-limit unit per invoice, so the request also has to fit into `limitPerMinute`.
      operationId: createInvoicesBulk
      requestBody:
        content:
          application/json:
            examples:
              invoices:
                summary: Two invoices
                value:
                  invoices:
                  - date: '2026-01-31'
                    items:
                    - description: Beratung
                      price: 95
                      quantity: 8
                      unit: h
                    number: 2026-001
                    recipient:
                      address: Kundenweg 5
                      city: 54321 Kundenstadt
                      name: Kunde AG
                  - date: '2026-02-03'
                    items:
                    - description: Wartungspauschale
                      price: 149.99
                      quantity: 1
                      unit: flat
                    number: 2026-002
                    recipient:
                      address: Beispielallee 2
                      city: 10115 Berlin
                      name: Beispiel KG
                  settings:
                    bank:
                      iban: DE89370400440532013000
                    sender:
                      address: Musterstr. 1
                      city: 12345 Musterstadt
                      name: Muster GmbH
            schema:
              $ref: '#/components/schemas/InvoiceBulkRequest'
        required: true
      responses:
        '200':
          $ref: '#/components/responses/Zip'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
      summary: Create many invoices (ZIP of PDFs)
      tags:
      - Invoices
  /v1/token:
    get:
      description: |-
        Kind, plan, rate limit, bulk size and end date of the token used for the request. Does not cost a
        rate-limit unit.
      operationId: getToken
      responses:
        '200':
          content:
            application/json:
              examples:
                paid:
                  summary: Purchased token
                  value:
                    bulkMax: 25
                    expiresAt: 1798761600
                    id: 7f3k2m9q
                    kind: paid
                    limitPerMinute: 30
                    plan: starter
                    subscription: false
              schema:
                $ref: '#/components/schemas/TokenInfo'
          description: The token's properties.
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
      summary: Information about the calling token
      tags:
      - Token
  /v1/version:
    get:
      description: |-
        Public: needs no token and costs no rate-limit unit. Also available as `GET /version` on the backend
        itself (for probes that bypass the ingress, which only forwards `/v1`).
      operationId: getVersion
      responses:
        '200':
          content:
            application/json:
              examples:
                release:
                  summary: Release build
                  value:
                    commit: 5f3a9c1d2b7e4a60918c3d5e7f1a2b4c6d8e0f12
                    templateHash: 9b1e4c7a0d3f6a2851c4e7b0d3a6f9c2185b4e7a0d3c6f9b2e5a8d1c4f7b0e3a
                    templates:
                      credit-note: 2c5f8b1e4a7d0c3f6b9e2a5d8c1f4b7e0a3d6c9f2b5e8a1d4c7f0b3e6a9d2c5f
                      delivery-note: 3d6a9c2f5b8e1a4d7c0f3b6e9a2d5c8f1b4e7a0d3c6f9b2e5a8d1c4f7b0e3a6d
                      dunning: 8c1f4b7e0a3d6c9f2b5e8a1d4c7f0b3e6a9d2c5f8b1e4a7d0c3f6b9e2a5d8c1f
                      invoice: 4e7b0d3a6c9f2b5e8a1d4c7f0b3e6a9d2c5f8b1e4a7d0c3f6b9e2a5d8c1f4b7e
                      letter: 5f8c1e4b7a0d3c6f9b2e5a8d1c4f7b0e3a6d9c2f5b8e1a4d7c0f3b6e9a2d5c8f
                      offer: 6a9d2c5f8b1e4a7d0c3f6b9e2a5d8c1f4b7e0a3d6c9f2b5e8a1d4c7f0b3e6a9d
                      order: 7b0e3a6d9c2f5b8e1a4d7c0f3b6e9a2d5c8f1b4e7a0d3c6f9b2e5a8d1c4f7b0e
                      report: 9c2f5b8e1a4d7c0f3b6e9a2d5c8f1b4e7a0d3c6f9b2e5a8d1c4f7b0e3a6d9c2f
                    typst: 0.15.1
                    version: 1.4.0
              schema:
                $ref: '#/components/schemas/VersionInfo'
          description: The version of the running backend.
      security: []
      summary: Version of this backend, its Typst compiler and its templates
      tags:
      - Version
components:
  headers:
    ContentDisposition:
      description: '`attachment; filename="…"` with the suggested file name.'
      schema:
        type: string
    PdfcraftVersion:
      description: Release version of the backend that produced the response (same as `version` of `GET /v1/version`).
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before the request is repeated.
      schema:
        minimum: 1
        type: integer
  responses:
    BadRequest:
      content:
        application/json:
          examples:
            bulk:
              value:
                details: '`invoices` needs 1 to 25 entries'
                error: invalid_request
            validation:
              value:
                details: 'invoice.recipient.name: is required; invoice.items[0].taxRate: must be one of: 19, 7, 0'
                error: validation_error
          schema:
            $ref: '#/components/schemas/Error'
      description: |
        The request is invalid. `validation_error`: `details` lists all problems with their paths, separated
        by `; `. `invalid_request`: malformed JSON, unknown `type`, or an empty or too large bulk list.
        `invalid_asset`: the logo is not valid base64 or too large. `POST /v1/einvoices/parse` also answers
        `unsupported_file` (neither PDF nor XML), `invalid_xml`, `unsupported_einvoice` (not CII or UBL, or
        ZUGFeRD 1.x), `no_xml_attachment`, `pdf_encrypted` and `pdf_unreadable`.
    Pdf:
      content:
        application/pdf:
          schema:
            contentEncoding: binary
            contentMediaType: application/pdf
            type: string
      description: The PDF (PDF/A-3b).
      headers:
        Content-Disposition:
          $ref: '#/components/headers/ContentDisposition'
        X-Pdfcraft-Version:
          $ref: '#/components/headers/PdfcraftVersion'
    RateLimited:
      content:
        application/json:
          example:
            details: rate limit of 30 invoices per minute reached
            error: rate_limited
          schema:
            $ref: '#/components/schemas/Error'
      description: The per-minute limit of the token is reached (`rate_limited`). Repeat the request after `Retry-After` seconds.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
    ServerError:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: An internal error (`task_join_error`, `zip_error`). Repeat the request; report it if it persists.
    TooLarge:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: The request body is larger than the limit (2 MB; 20 MB PDF / 5 MB XML for `POST /v1/einvoices/parse`) (`invalid_request`).
    Unauthorized:
      content:
        application/json:
          example:
            details: 'missing, invalid or expired token (use `Authorization: Bearer <token>` or `X-API-Key`)'
            error: unauthorized
          schema:
            $ref: '#/components/schemas/Error'
      description: The token is missing, invalid, expired or revoked.
      headers:
        WWW-Authenticate:
          description: Always `Bearer`.
          schema:
            type: string
    Unavailable:
      content:
        application/json:
          example:
            details: all compile slots are busy, please retry shortly
            error: server_busy
          schema:
            $ref: '#/components/schemas/Error'
      description: |
        `store_unavailable`: the token store is not reachable. `server_busy`: all compile slots stayed busy,
        repeat the request after `Retry-After` seconds.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
    Unprocessable:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: |
        `invalid_request`: the JSON is well-formed but a required field (for example `settings` or `invoice`)
        is missing or has the wrong type. `typst_compile_error`: the template could not be compiled; this
        should not happen with validated input, please report it.
    UnsupportedMediaType:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: 'The request has no `Content-Type: application/json` header (`invalid_request`).'
    Zip:
      content:
        application/zip:
          schema:
            contentEncoding: binary
            contentMediaType: application/zip
            type: string
      description: A ZIP archive with one PDF per entry, in the order of the request.
      headers:
        Content-Disposition:
          $ref: '#/components/headers/ContentDisposition'
        X-Pdfcraft-Version:
          $ref: '#/components/headers/PdfcraftVersion'
  schemas:
    Adjustment:
      properties:
        amount:
          format: double
          type:
          - number
          - 'null'
        charge:
          description: '`true` for a charge, `false` for an allowance.'
          type: boolean
        reason:
          type: string
        taxCategory:
          type: string
        taxRate:
          format: double
          type:
          - number
          - 'null'
      required:
      - charge
      - amount
      - taxRate
      type: object
    Bank:
      properties:
        bic:
          maxLength: 200
          type: string
        iban:
          maxLength: 200
          type: string
        name:
          maxLength: 200
          type: string
      type: object
    CheckResult:
      properties:
        findings:
          description: Findings in plain language (why it failed or was skipped); empty when `ok`.
          items:
            type: string
          type: array
        id:
          description: Stable identifier of the check, e.g. `header`, `line-math`, `gross-total`.
          type: string
        status:
          $ref: '#/components/schemas/Status'
        title:
          description: What the check verifies, in the requested language.
          type: string
      required:
      - id
      - title
      - status
      - findings
      type: object
    Document:
      description: |-
        A document; the required fields depend on `type` (see `POST /v1/documents`). `recipient` has only
        `name`, `address` and `city` for letters, offers, orders and delivery notes; for credit notes the
        e-invoice fields `vatId`, `email` and `buyerReference` are used as well.
      properties:
        body:
          description: Letter text.
          maxLength: 10000
          type: string
        closing:
          maxLength: 2000
          type: string
        date:
          description: Document date as `YYYY-MM-DD` (years 1970 to 2200).
          format: date
          type: string
        deliveryDate:
          description: 'Order confirmation and delivery note: delivery date (`YYYY-MM-DD`).'
          format: date
          type: string
        dunningLevel:
          description: 'Dunning letter: level 1 (payment reminder), 2 (dunning letter) or 3 (final dunning letter).'
          format: double
          maximum: 3
          minimum: 1
          type: number
        fees:
          description: 'Dunning letter: fees and expenses (up to 20).'
          items:
            $ref: '#/components/schemas/DunningFee'
          maxItems: 20
          type: array
        interest:
          $ref: '#/components/schemas/DunningInterest'
          description: 'Dunning letter: default interest (§ 288 BGB) for a period, amount given by the caller.'
        intro:
          maxLength: 2000
          type: string
        invoices:
          description: 'Dunning letter: the open invoices (1 to 100).'
          items:
            $ref: '#/components/schemas/DunningInvoice'
          maxItems: 100
          type: array
        items:
          description: 1 to 500 items (not used for letters; delivery notes show no prices).
          items:
            $ref: '#/components/schemas/Item'
          maxItems: 500
          type: array
        landscape:
          default: false
          description: 'Report: print on landscape A4.'
          type: boolean
        meta:
          description: 'Report: meta block, label and value pairs below the title (up to 12).'
          items:
            $ref: '#/components/schemas/ReportMeta'
          maxItems: 12
          type: array
        number:
          description: Document number (not used for letters).
          maxLength: 200
          type: string
        paymentDeadline:
          description: 'Dunning letter: new payment deadline (`YYYY-MM-DD`, not before the document date).'
          format: date
          type: string
        period:
          description: 'Report: period as free text, for example `Januar bis Dezember 2026`.'
          maxLength: 200
          type: string
        postage:
          $ref: '#/components/schemas/Postage'
          description: Franking mark (Internetmarke PNG) printed into the address field.
        reason:
          description: 'Credit note: reason.'
          maxLength: 2000
          type: string
        recipient:
          $ref: '#/components/schemas/Recipient'
        reference:
          description: The cancelled invoice (credit note), the offer (order confirmation) or the order (delivery note).
          maxLength: 200
          type: string
        referenceDate:
          description: Date of the referenced document (`YYYY-MM-DD`).
          format: date
          type: string
        subject:
          description: Letter subject.
          maxLength: 200
          type: string
        tables:
          description: 'Report: 1 to 20 tables with at most 10,000 rows in total.'
          items:
            $ref: '#/components/schemas/ReportTable'
          maxItems: 20
          type: array
        title:
          description: 'Report: title (required).'
          maxLength: 200
          type: string
        validUntil:
          description: 'Offer: valid until (`YYYY-MM-DD`).'
          format: date
          type: string
      type: object
    DocumentBulkRequest:
      description: Many documents of one type with shared settings.
      properties:
        documents:
          description: Between 1 and `bulkMax` of the token (see `GET /v1/token`).
          items:
            $ref: '#/components/schemas/Document'
          minItems: 1
          type: array
        options:
          $ref: '#/components/schemas/Options'
        settings:
          $ref: '#/components/schemas/Settings'
        type:
          $ref: '#/components/schemas/DocumentType'
      required:
      - type
      - settings
      - documents
      type: object
    DocumentRequest:
      description: One document of the given type with its settings.
      properties:
        document:
          $ref: '#/components/schemas/Document'
        options:
          $ref: '#/components/schemas/Options'
        settings:
          $ref: '#/components/schemas/Settings'
        type:
          $ref: '#/components/schemas/DocumentType'
      required:
      - type
      - settings
      - document
      type: object
    DocumentType:
      description: Type of a document; selects the template.
      enum:
      - credit-note
      - offer
      - order
      - delivery-note
      - letter
      - dunning
      - report
      type: string
    DunningFee:
      description: A dunning fee or expense, for example the dunning fee.
      properties:
        amount:
          description: Amount in euro (0 to 1e9).
          format: double
          maximum: 1000000000
          minimum: 0
          type: number
        description:
          description: Text of the line, for example `Mahngebühr`.
          maxLength: 200
          type: string
      required:
      - description
      - amount
      type: object
    DunningInterest:
      description: |-
        Default interest (Verzugszinsen, § 288 BGB) for a period. Either give `rate` and `amount` (nothing is
        calculated) or give `debtor`, then PDFCraft calculates the interest per invoice from the base rate.
      properties:
        amount:
          description: |-
            Own calculation: interest amount in euro for the period (0 to 1e9). Required with `rate`; not
            allowed together with `debtor`.
          format: double
          maximum: 1000000000
          minimum: 0
          type: number
        baseRate:
          description: |-
            Calculation: base rate in percent (-10 to 20) for the whole period instead of the built-in table,
            for example for a period the table does not cover yet.
          format: double
          maximum: 20
          minimum: -10
          type: number
        debtor:
          description: |-
            Calculate the interest: `consumer` (base rate + 5 percentage points, § 288 para. 1 BGB) or
            `business` (base rate + 9 percentage points, § 288 para. 2 BGB, transactions without a consumer).
            The interest of each invoice is its open amount x rate x days / 365, split at the half-yearly
            changes of the base rate (§ 247 BGB).
          pattern: ^(consumer|business)$
          type: string
        from:
          description: |-
            Start of the interest period as `YYYY-MM-DD`. Required with `rate`. With `debtor` it is optional;
            without it the interest of each invoice starts the day after its due date.
          format: date
          type: string
        rate:
          description: |-
            Own calculation: annual interest rate in percent (greater than 0, at most 100), for example
            `12.27`. Needs `from`, `to` and `amount`; not allowed together with `debtor`.
          format: double
          maximum: 100
          minimum: 0
          type: number
        to:
          description: |-
            End of the interest period as `YYYY-MM-DD` (not before `from`), inclusive. Required with `rate`.
            With `debtor` it is optional and defaults to the document date.
          format: date
          type: string
      type: object
    DunningInvoice:
      description: An open invoice listed in a dunning letter.
      properties:
        date:
          description: Invoice date as `YYYY-MM-DD`.
          format: date
          type: string
        dueDate:
          description: Due date of the invoice as `YYYY-MM-DD` (not before the invoice date).
          format: date
          type: string
        number:
          description: Number of the open invoice.
          maxLength: 200
          type: string
        openAmount:
          description: Still open gross amount in euro (greater than 0, at most 1e9).
          format: double
          maximum: 1000000000
          minimum: 0
          type: number
      required:
      - number
      - date
      - dueDate
      - openAmount
      type: object
    Error:
      description: The error envelope of every error response.
      properties:
        details:
          description: Human-readable explanation in English.
          type: string
        error:
          description: Stable error code.
          enum:
          - validation_error
          - invalid_request
          - invalid_asset
          - unauthorized
          - rate_limited
          - store_unavailable
          - server_busy
          - typst_compile_error
          - template_parse_error
          - template_render_error
          - task_join_error
          - zip_error
          - unsupported_file
          - pdf_encrypted
          - pdf_unreadable
          - no_xml_attachment
          - invalid_xml
          - unsupported_einvoice
          type: string
      required:
      - error
      - details
      type: object
    Image:
      description: An uploaded file (logo or signature), base64 encoded.
      properties:
        base64:
          description: The file, base64 encoded (at most 1 MB decoded for a logo, 300 KB for a signature).
          type: string
      required:
      - base64
      type: object
    Invoice:
      properties:
        date:
          description: Invoice date as `YYYY-MM-DD` (years 1970 to 2200).
          format: date
          type: string
        dueDate:
          description: Optional override for the due date (otherwise derived from the payment term).
          format: date
          type: string
        items:
          items:
            $ref: '#/components/schemas/Item'
          maxItems: 500
          minItems: 1
          type: array
        number:
          maxLength: 200
          type: string
        postage:
          $ref: '#/components/schemas/Postage'
          description: Franking mark (Internetmarke PNG) printed into the address field.
        recipient:
          $ref: '#/components/schemas/Recipient'
        serviceDate:
          description: Optional date of service (defaults to the invoice date).
          format: date
          type: string
        serviceDateFrom:
          description: Optional inclusive start of the service period; use together with `serviceDateTo`.
          format: date
          type: string
        serviceDateTo:
          description: Optional inclusive end of the service period; use together with `serviceDateFrom`.
          format: date
          type: string
      required:
      - number
      - date
      - recipient
      - items
      type: object
    InvoiceBulkRequest:
      description: Many invoices with shared settings.
      properties:
        invoices:
          description: Between 1 and `bulkMax` of the token (see `GET /v1/token`).
          items:
            $ref: '#/components/schemas/Invoice'
          minItems: 1
          type: array
        options:
          $ref: '#/components/schemas/Options'
        settings:
          $ref: '#/components/schemas/Settings'
      required:
      - settings
      - invoices
      type: object
    InvoiceRequest:
      description: One invoice with its settings.
      properties:
        invoice:
          $ref: '#/components/schemas/Invoice'
        options:
          $ref: '#/components/schemas/Options'
        settings:
          $ref: '#/components/schemas/Settings'
      required:
      - settings
      - invoice
      type: object
    InvoiceView:
      description: |-
        One syntax-independent view of a received e-invoice (CII: ZUGFeRD/Factur-X/XRechnung CII, UBL: XRechnung UBL/Peppol).
        Missing optional parts are left out of the JSON.
      properties:
        adjustments:
          description: Document level allowances and charges.
          items:
            $ref: '#/components/schemas/Adjustment'
          type: array
        buyer:
          $ref: '#/components/schemas/Party'
        buyerReference:
          type: string
        contractReference:
          type: string
        currency:
          type: string
        deliveryDate:
          description: ISO date (`YYYY-MM-DD`)
          type: string
        dueDate:
          description: ISO date (`YYYY-MM-DD`)
          type: string
        issueDate:
          description: ISO date (`YYYY-MM-DD`)
          type: string
        items:
          items:
            $ref: '#/components/schemas/LineView'
          type: array
        notes:
          items:
            type: string
          type: array
        number:
          type: string
        orderReference:
          type: string
        payee:
          $ref: '#/components/schemas/Party'
        paymentReference:
          type: string
        paymentTerms:
          type: string
        payments:
          items:
            $ref: '#/components/schemas/PaymentMeans'
          type: array
        precedingInvoices:
          items:
            $ref: '#/components/schemas/PrecedingInvoice'
          type: array
        profile:
          description: Specification identifier (BT-24), e.g. `urn:cen.eu:en16931:2017#compliant#urn:xeinkauf.de:kosit:xrechnung_3.0`.
          type: string
        seller:
          $ref: '#/components/schemas/Party'
        syntax:
          $ref: '#/components/schemas/Syntax'
          description: 'Syntax of the XML: `cii` or `ubl`.'
        taxes:
          items:
            $ref: '#/components/schemas/TaxView'
          type: array
        totals:
          $ref: '#/components/schemas/Totals'
        typeCode:
          description: UNTDID 1001 code from BT-3 (`380` invoice, `381` credit note, ...).
          type: string
      required:
      - syntax
      - precedingInvoices
      - seller
      - buyer
      - notes
      - items
      - adjustments
      - taxes
      - totals
      - payments
      type: object
    Item:
      properties:
        description:
          maxLength: 2000
          type: string
        price:
          description: Net unit price in euro (between -1e9 and 1e9).
          format: double
          maximum: 1000000000
          minimum: -1000000000
          type: number
        quantity:
          description: Quantity (between -1e9 and 1e9).
          format: double
          maximum: 1000000000
          minimum: -1000000000
          type: number
        taxRate:
          default: 19
          description: Tax rate in percent.
          enum:
          - 19
          - 7
          - 0
          format: int64
          type: integer
        unit:
          default: pcs
          description: 'Unit of the quantity: pieces, hour, day, month, year, flat rate, kg, m, km, m², litre.'
          enum:
          - pcs
          - h
          - d
          - mo
          - y
          - flat
          - kg
          - m
          - km
          - m2
          - l
          type: string
      required:
      - description
      - quantity
      - price
      type: object
    LineView:
      properties:
        buyerItemId:
          type: string
        description:
          type: string
        hasAdjustments:
          description: The line has its own allowances or charges, so quantity × price does not have to equal the net amount.
          type: boolean
        id:
          type: string
        name:
          type: string
        net:
          description: Net line amount (BT-131).
          format: double
          type:
          - number
          - 'null'
        note:
          type: string
        price:
          description: Net unit price (BT-146).
          format: double
          type:
          - number
          - 'null'
        priceBasis:
          description: Quantity the price refers to (BT-149), 1 when not given.
          format: double
          type: number
        quantity:
          format: double
          type:
          - number
          - 'null'
        sellerItemId:
          type: string
        taxCategory:
          type: string
        taxRate:
          format: double
          type:
          - number
          - 'null'
        unit:
          type: string
      required:
      - quantity
      - price
      - priceBasis
      - net
      - hasAdjustments
      - taxRate
      type: object
    Options:
      description: Optional per-request render options.
      properties:
        watermark:
          $ref: '#/components/schemas/WatermarkOption'
          description: |-
            `draft` prints the diagonal "Entwurf" / "Draft" watermark (by document language) on every PDF of the
            request, for any token. Free tokens always get the watermark, with or without this option.
      type: object
    ParseResponse:
      description: The view of an e-invoice and the result of the limited plausibility check.
      properties:
        checks:
          description: |-
            Plausibility checks (mandatory fields, sums, dates, IBAN). This is NOT a validation against EN 16931 or
            the XRechnung rules.
          items:
            $ref: '#/components/schemas/CheckResult'
          type: array
        fileName:
          description: Name of the attachment the XML was read from (`pdf`) or `fileName` of the request (`xml`).
          type: string
        invoice:
          $ref: '#/components/schemas/InvoiceView'
          description: The normalized view of the e-invoice.
        notChecked:
          description: What the checks do not cover, in the requested language.
          items:
            type: string
          type: array
        source:
          $ref: '#/components/schemas/Source'
          description: '`pdf` when the XML was read from the attachment of a PDF, `xml` for an XML upload.'
      required:
      - source
      - fileName
      - invoice
      - checks
      - notChecked
      type: object
    Party:
      properties:
        city:
          type: string
        contactName:
          type: string
        country:
          type: string
        email:
          type: string
        name:
          type: string
        phone:
          type: string
        postcode:
          type: string
        registration:
          description: Legal registration (e.g. commercial register number).
          type: string
        street:
          type: string
        street2:
          type: string
        taxNumber:
          type: string
        tradeName:
          type: string
        vatId:
          type: string
      type: object
    PaymentMeans:
      properties:
        accountName:
          type: string
        bankName:
          type: string
        bic:
          type: string
        code:
          description: UNTDID 4461 code (`58` SEPA credit transfer, `59` SEPA direct debit, `30` credit transfer, ...).
          type: string
        iban:
          type: string
        reference:
          type: string
      type: object
    Postage:
      description: Franking mark (Internetmarke) printed into the address field. It is valid for one letter only.
      properties:
        base64:
          description: The PNG, base64 encoded (at most 300 KB decoded); it has to fit into the address field.
          type: string
      required:
      - base64
      type: object
    PrecedingInvoice:
      properties:
        date:
          description: ISO date
          type: string
        number:
          type: string
      required:
      - number
      type: object
    Recipient:
      properties:
        address:
          maxLength: 200
          type: string
        buyerReference:
          description: Buyer reference (Leitweg-ID for public customers); required by XRechnung.
          maxLength: 200
          type: string
        city:
          maxLength: 200
          type: string
        email:
          description: Used for credit notes and invoices (e-invoice).
          maxLength: 200
          type: string
        name:
          maxLength: 200
          type: string
        vatId:
          description: Used for credit notes and invoices (e-invoice).
          maxLength: 200
          type: string
      required:
      - name
      - address
      - city
      type: object
    ReportCell:
      description: |-
        A table cell: text in `text` columns, a number in `number` and `amount` columns. `null` is an
        empty cell that adds nothing to a sum.
      oneOf:
      - format: double
        type: number
      - type: string
    ReportColumn:
      description: A table column.
      properties:
        align:
          description: '`left`, `center` or `right`. Default: `left` for text, `right` for numbers and amounts.'
          type: string
        decimals:
          description: |-
            Decimal places (0 to 4) of numbers and amounts, values are rounded half away from zero.
            Default: 2 for `amount`, 0 for `number`.
          format: double
          maximum: 4
          minimum: 0
          type: number
        label:
          description: Column heading.
          maxLength: 200
          type: string
        sum:
          default: false
          description: Print the sum of the column in the subtotal and total rows (`number` and `amount` only).
          type: boolean
        type:
          description: |-
            `text` (default), `number` or `amount`. Numbers and amounts are formatted like the other
            documents (`1.234,56`) and aligned to the right.
          type: string
        width:
          description: |-
            Relative width (1 to 100). Columns with a width share the space that the others leave free;
            without any width the column with the longest text takes the free space and the others fit
            their content.
          format: double
          maximum: 100
          minimum: 1
          type: number
      required:
      - label
      type: object
    ReportGroup:
      description: A group of rows with an optional heading and a subtotal row.
      properties:
        rows:
          description: 'The rows of the group: one array per row with one cell per column.'
          items:
            items:
              oneOf:
              - $ref: '#/components/schemas/ReportCell'
              - type: 'null'
            type: array
          minItems: 1
          type: array
        subtotal:
          description: 'Print a subtotal row with the sums of the group (default: true when a column has `sum`).'
          type: boolean
        subtotalLabel:
          description: 'Label of the subtotal row (default: `Zwischensumme <title>` / `Subtotal <title>`).'
          maxLength: 200
          type: string
        title:
          description: Heading row above the group; without it the group has no heading row.
          maxLength: 200
          type: string
      required:
      - rows
      type: object
    ReportMeta:
      description: One line of the meta block (label and value) below the title.
      properties:
        label:
          description: Label, for example `Mandant`.
          maxLength: 200
          type: string
        value:
          description: Value; entries without a value are not printed.
          maxLength: 200
          type: string
      required:
      - label
      type: object
    ReportTable:
      description: A table; its header is repeated on every page.
      properties:
        columns:
          description: 1 to 12 columns.
          items:
            $ref: '#/components/schemas/ReportColumn'
          maxItems: 12
          minItems: 1
          type: array
        groups:
          description: Groups of rows with subtotals. Use either `rows` or `groups`.
          items:
            $ref: '#/components/schemas/ReportGroup'
          type: array
        rows:
          description: |-
            The rows of a table without groups: one array per row with one cell per column. Use either
            `rows` or `groups`.
          items:
            items:
              oneOf:
              - $ref: '#/components/schemas/ReportCell'
              - type: 'null'
            type: array
          type: array
        title:
          description: Heading above the table.
          maxLength: 200
          type: string
        total:
          description: 'Print a total row with the sums of the table (default: true when a column has `sum`).'
          type: boolean
        totalLabel:
          description: 'Label of the total row (default: `Gesamt` / `Total`).'
          maxLength: 200
          type: string
      required:
      - columns
      type: object
    Sender:
      description: Plain text of at most 200 characters; do not escape it, the server does.
      properties:
        address:
          maxLength: 200
          type: string
        city:
          maxLength: 200
          type: string
        contactName:
          maxLength: 200
          type: string
        email:
          maxLength: 200
          type: string
        name:
          maxLength: 200
          type: string
        phone:
          maxLength: 200
          type: string
        taxNr:
          maxLength: 200
          type: string
        vatId:
          maxLength: 200
          type: string
      required:
      - name
      - address
      - city
      type: object
    Settings:
      description: |-
        Sender and design, shared by all documents of a request. This is the structure the configurator
        exports; unknown fields (for example `schemaVersion`) are ignored.
      properties:
        accentColor:
          default: '#1d4ed8'
          description: Color as `#rrggbb`.
          pattern: ^#[0-9a-fA-F]{6}$
          type: string
        bank:
          $ref: '#/components/schemas/Bank'
        closing:
          description: Text below the totals.
          maxLength: 2000
          type: string
        design:
          default: classic
          description: Document layout.
          enum:
          - classic
          - modern-minimal
          - contrast
          type: string
        einvoiceProfile:
          default: en16931
          description: '`en16931` attaches `factur-x.xml` (ZUGFeRD / Factur-X), `xrechnung` attaches `xrechnung.xml`.'
          enum:
          - en16931
          - xrechnung
          type: string
        exemptionReason:
          default: Steuerfrei nach § 4 UStG
          description: Reason printed and sent in the e-invoice for items with a tax rate of 0 %.
          maxLength: 200
          type: string
        font:
          default: Liberation Sans
          description: One of the fonts offered by the configurator.
          enum:
          - Liberation Sans
          - Carlito
          - Open Sans
          - Roboto
          - Lato
          - DejaVu Sans
          - Liberation Serif
          - Libertinus Serif
          - New Computer Modern
          - DejaVu Sans Mono
          type: string
        footer:
          maxLength: 2000
          type: string
        intro:
          description: Text above the items.
          maxLength: 2000
          type: string
        locale:
          default: de-de
          description: Language of the document texts.
          enum:
          - de-de
          - en-de
          type: string
        logo:
          $ref: '#/components/schemas/Image'
          description: Logo printed in the letterhead (PNG, JPEG or SVG).
        paymentDays:
          default: 14
          description: Payment term in days (whole number from 0 to 365).
          format: int64
          maximum: 365
          minimum: 0
          type: integer
        sender:
          $ref: '#/components/schemas/Sender'
        signature:
          $ref: '#/components/schemas/Image'
          description: |-
            Handwritten signature printed below the closing text: PNG, JPEG, SVG or PDF (detected by content,
            at most 300 KB decoded). It is an image, not a cryptographic signature.
        zugferd:
          default: true
          description: Attach the e-invoice XML to the PDF.
          type: boolean
      required:
      - sender
      type: object
    Source:
      enum:
      - pdf
      - xml
      type: string
    Status:
      enum:
      - ok
      - warning
      - error
      - skipped
      type: string
    Syntax:
      enum:
      - cii
      - ubl
      type: string
    TaxView:
      properties:
        amount:
          format: double
          type:
          - number
          - 'null'
        basis:
          format: double
          type:
          - number
          - 'null'
        category:
          type: string
        exemptionCode:
          type: string
        exemptionReason:
          type: string
        rate:
          format: double
          type:
          - number
          - 'null'
      required:
      - rate
      - basis
      - amount
      type: object
    TokenInfo:
      description: Properties of the token that made the request.
      properties:
        bulkMax:
          description: Maximum entries per bulk request.
          minimum: 0
          type: integer
        expiresAt:
          description: End of the token (unix seconds); `null` if unknown or for a service token, which does not expire.
          format: int64
          minimum: 0
          type:
          - integer
          - 'null'
        id:
          description: Public token id (not the secret).
          type: string
        kind:
          description: '`free`, `paid` or `service`.'
          enum:
          - free
          - paid
          - service
          type: string
        limitPerMinute:
          description: PDFs per minute.
          format: int32
          minimum: 0
          type: integer
        plan:
          description: '`free` for free tokens, otherwise the purchased plan.'
          type: string
        subscription:
          description: Whether a subscription renews the token.
          type: boolean
      required:
      - kind
      - id
      - plan
      - limitPerMinute
      - bulkMax
      - expiresAt
      - subscription
      type: object
    Totals:
      description: Amounts of the document; `null` when the file does not state them.
      properties:
        allowanceTotal:
          format: double
          type:
          - number
          - 'null'
        chargeTotal:
          format: double
          type:
          - number
          - 'null'
        due:
          description: Amount due for payment (BT-115).
          format: double
          type:
          - number
          - 'null'
        grandTotal:
          description: Total with VAT (BT-112).
          format: double
          type:
          - number
          - 'null'
        lineTotal:
          format: double
          type:
          - number
          - 'null'
        prepaid:
          format: double
          type:
          - number
          - 'null'
        rounding:
          format: double
          type:
          - number
          - 'null'
        taxBasis:
          description: Total without VAT (BT-109).
          format: double
          type:
          - number
          - 'null'
        taxTotal:
          format: double
          type:
          - number
          - 'null'
      required:
      - lineTotal
      - allowanceTotal
      - chargeTotal
      - taxBasis
      - taxTotal
      - grandTotal
      - prepaid
      - rounding
      - due
      type: object
    VersionInfo:
      description: Which build rendered a document; store it next to the input of every issued document.
      properties:
        commit:
          description: Git commit the backend was built from; `unknown` for local builds.
          type: string
        templateHash:
          description: SHA-256 (hex) over the hashes of all templates; changes whenever any template changes.
          type: string
        templates:
          additionalProperties:
            type: string
          description: |-
            SHA-256 (hex) of the complete Typst source (shared layout plus body) per template, by
            document type (`invoice`, `credit-note`, `offer`, ...).
          propertyNames:
            type: string
          type: object
        typst:
          description: Version of the Typst compiler that lays out the PDFs.
          type: string
        version:
          description: Release version (the image tag, e.g. `1.4.0`); the crate version for local builds.
          type: string
      required:
      - version
      - commit
      - typst
      - templateHash
      - templates
      type: object
    WatermarkOption:
      description: Value of `options.watermark`.
      enum:
      - draft
      type: string
  securitySchemes:
    apiKeyAuth:
      description: Alternative to the bearer header; the same token.
      in: header
      name: X-API-Key
      type: apiKey
    bearerAuth:
      description: 'The token as `Authorization: Bearer <token>`'
      scheme: bearer
      type: http
