openapi: 3.1.0
info:
  contact:
    email: hello@maltina.pro
    name: maltina.pro
    url: https://maltina.pro/
  description: |
    The server holds the templates; clients send only data. All text is validated and escaped by the server,
    so do **not** escape it yourself. Problems of a request are returned together as `400 validation_error`.

    **Authentication.** Every endpoint below needs a token, sent as `Authorization: Bearer <token>` or as
    `X-API-Key: <token>`. Purchased tokens (`pk_…`) create clean documents. Free tokens (`pf_…`) are issued
    to browsers only (they need a solved Anubis challenge) and put an "Entwurf" / "Draft" watermark on every PDF.
    Any token can request the same watermark for previews by sending `"options": { "watermark": "draft" }` in
    the request body (all four POST endpoints); free tokens always keep it, with or without the option.

    **Rate limit.** Every PDF costs one unit of the token's per-minute limit (`limitPerMinute` of `GET /v1/token`).
    A bulk request costs one unit per entry and is accepted or rejected as a whole. When the limit is reached the
    server answers `429 rate_limited` with a `Retry-After` header (seconds).

    **Errors.** Every error is JSON: `{ "error": "<code>", "details": "<text>" }`. The codes are stable; the
    texts are English and may change.

    **Request size.** JSON request bodies are limited to 2 MB (`413` above that). `POST /v1/einvoices/parse` takes
    the file itself as the body: PDFs up to 20 MB, XML files up to 5 MB.

    For the browser preview only, add `?zones=1` to `POST /v1/invoices` or `POST /v1/documents`.
    The response then includes `X-Pdfcraft-Zones`, JSON geometry for zones 3 and 4 in millimeters.
    Without the flag this header is omitted; bulk responses are unchanged.

    **Version.** Every response carries `X-Pdfcraft-Version` (the release version of the backend, also on errors).
    `GET /v1/version` needs no token and adds the git commit, the Typst version and a SHA-256 hash of every
    template. Store these with the input of each issued document to reproduce its rendering later.

    The request examples are tested against the backend, so they stay valid.
  license:
    identifier: MIT
    name: MIT
  summary: Create invoices and business documents as PDF (with ZUGFeRD / Factur-X or XRechnung data) from plain JSON.
  title: digitalrechnung.jetzt API
  version: 1.0.0
servers:
- description: Demo / production
  url: https://digitalrechnung.jetzt
- description: Local backend (`cargo run` or `docker compose up`)
  url: http://localhost:3000
security:
- bearerAuth: []
- apiKeyAuth: []
tags:
- description: E-invoices (ZUGFeRD / Factur-X, XRechnung) as PDF.
  name: Invoices
- description: Credit notes, offers, order confirmations, delivery notes, letters, dunning letters and reports (tables) as PDF.
  name: Documents
- description: Read and check a received e-invoice (ZUGFeRD / Factur-X PDF or CII / UBL XML) without storing it.
  name: E-invoices
- description: Information about the calling token.
  name: Token
- description: Version of the backend that renders the documents.
  name: Version
paths:
  /v1/documents:
    post:
      description: |-
        Credit note (Stornorechnung), offer, order confirmation, delivery note, letter, dunning letter
        (Mahnung) or report (tables); `type` selects the template. Same authentication, rate limit (one unit per PDF), watermark rules and error format as
        `POST /v1/invoices`. Only `settings.sender`, the logo, signature, accent color, font, locale and footer
        are used. A credit note carries an EN 16931 / XRechnung credit-note XML (TypeCode 381) when
        `settings.zugferd` is on. A dunning letter also uses `settings.bank` (account and EPC QR code of the
        payment block) and carries no XML. A report is a generic document of tables (journal, trial balance,
        evaluations): title, period, meta block and up to 20 tables with typed columns, group subtotals and
        totals; it has no recipient, no e-invoice XML and no stamp, the table header repeats on every page and
        the footer shows "Seite x von y". Limits: 12 columns per table and 10,000 rows in total.

        Required `document` fields by `type`:

        | `type` | Required | Optional |
        | --- | --- | --- |
        | `credit-note` | `number`, `date`, `recipient`, `items`, `reference` (the cancelled invoice) | `referenceDate`, `reason`, `closing` |
        | `offer` | `number`, `date`, `recipient`, `items` | `validUntil`, `reference`, `intro`, `closing` |
        | `order` | `number`, `date`, `recipient`, `items` | `deliveryDate`, `reference`, `intro`, `closing` |
        | `delivery-note` | `number`, `date`, `recipient`, `items` (shown without prices) | `deliveryDate`, `reference`, `intro`, `closing` |
        | `letter` | `date`, `recipient`, `subject`, `body` | `reference`, `closing` |
        | `dunning` | `number`, `date`, `recipient`, `dunningLevel` (1 payment reminder, 2 dunning letter, 3 final dunning letter), `invoices` (1 to 100: `number`, `date`, `dueDate`, `openAmount`), `paymentDeadline` | `fees` (`description`, `amount`), `interest` (`rate`, `from`, `to`, `amount`, given by the caller), `intro`, `closing` |
        | `report` | `date`, `title`, `tables` (1 to 20, each with `columns` and `rows` or `groups`) | `number`, `period`, `meta` (`label`, `value`), `landscape`, `intro`, `closing` |
      operationId: createDocument
      parameters:
      - description: Include PDF zone geometry in `X-Pdfcraft-Zones`; only `1` enables it.
        in: query
        name: zones
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            examples:
              credit-note:
                summary: Credit note for invoice 2026-001
                value:
                  document:
                    date: '2026-02-10'
