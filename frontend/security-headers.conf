# Included by nginx.conf in the server block and again in every location that sets its own add_header
# (nginx does not inherit add_header into such a location).
# No inline scripts: theme bootstraps are public/static-theme.js and public/theme-init.js.
# connect-src 'self' needs a same-origin API (build with an empty VITE_API_BASE_URL).
# style-src 'unsafe-inline' is needed for React style attributes and Swagger UI.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
