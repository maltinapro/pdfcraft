# JSON access log on stdout (ingested by Loki). Deliberately without client IP,
# user agent, referer and query string.
log_format json escape=json
  '{"time":"$time_iso8601","service":"frontend","event":"http_request",'
  '"method":"$request_method","path":"$uri","status":$status,'
  '"bytes":$body_bytes_sent,"duration_s":$request_time}';

server {
    listen 80;
    access_log /dev/stdout json;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}
