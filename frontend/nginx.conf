# JSON access log on stdout (ingested by Loki). Deliberately without client IP,
# user agent, referer and query string.
log_format json escape=json
  '{"time":"$time_iso8601","service":"frontend","event":"http_request",'
  '"method":"$request_method","path":"$uri","status":$status,'
  '"bytes":$body_bytes_sent,"duration_s":$request_time}';

server {
    listen 80;
    access_log /dev/stdout json;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json text/xml;
    gzip_min_length 512;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Hashed build output never changes
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
