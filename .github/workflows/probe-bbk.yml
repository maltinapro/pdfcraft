name: Probe Bundesbank
on:
  workflow_dispatch:
  pull_request:
    paths: ['.github/workflows/probe-bbk.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -L -m 30 -o /tmp/p.html "https://www.bundesbank.de/de/bundesbank/organisation/agb-und-regelungen/basiszinssatz-607820"
          wc -c /tmp/p.html
          grep -oE 'href="[^"]*"' /tmp/p.html | grep -iE 'statist|zeitreih|csv|download|tsid|SU0|rmi|api' | sort -u | head -40
          echo ---- text
          sed -e 's/<script.*<\/script>//g' -e 's/<[^>]*>/ /g' /tmp/p.html | tr -s ' \n' | grep -iE 'zeitreihe|SU0|BBK|statist' | head -20
