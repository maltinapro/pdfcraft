name: Probe Bundesbank
on:
  workflow_dispatch:
  pull_request:
    paths: ['.github/workflows/probe-bbk.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for n in $(seq 100 135); do
            id="BBK01.SU0$n"
            out=$(curl -sS -m 30 "https://www.bundesbank.de/statistic-rmi/StatisticDownload?tsId=$id&its_csvFormat=en&its_fileFormat=csv&mode=its" | sed -n '2p' | head -c 200)
            echo "$id -> $out"
          done
          for u in \
            "https://api.statistiken.bundesbank.de/rest/metadata/dataflow" \
            "https://api.statistiken.bundesbank.de/rest/metadata/dataflow/BBK01" \
            "https://api.statistiken.bundesbank.de/rest/metadata/dataflow/BBK/BBK01" \
            "https://api.statistiken.bundesbank.de/rest/data/BBK01/D.I.ZST.ZI.EUR.S1311.B.A604.R10XX.R.A.A._Z._Z.A" \
            "https://api.statistiken.bundesbank.de/rest/data/BBK01/SU0115?detail=serieskeysonly" \
            ; do
            echo "=== $u"
            curl -sS -L -m 30 -w '\n[HTTP %{http_code}]\n' "$u" | head -c 500
            echo
          done
