name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Lints docs/openapi.yaml (rules in redocly.yaml; warnings fail the job). The file is generated from
  # the backend code: the backend tests (`openapi_*`) fail when it is outdated or an example is invalid.
  openapi:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npx --yes @redocly/cli@2.78.0 lint docs/openapi.yaml --max-problems 0

  backend:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo check --locked --all-targets
      - run: cargo test --locked

  # Renders a fixed corpus of e-invoices (see `renders_einvoice_conformance_corpus` in backend/src/v1.rs)
  # and fails if Mustang reports any of them as invalid.
  einvoice:
    runs-on: ubuntu-26.04
    env:
      MUSTANG_VERSION: 2.26.0
      MUSTANG_SHA256: 42d7868cb68264874a7b8cab4c3587b03b23ccc7cd72373da917f66758bb9736
      CORPUS_DIR: ${{ github.workspace }}/einvoice-corpus
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Render the e-invoice corpus
        working-directory: backend
        run: |
          mkdir -p "$CORPUS_DIR"
          PDF_OUT="$CORPUS_DIR" cargo test --locked renders_einvoice_conformance_corpus
          count=$(find "$CORPUS_DIR" -name 'einvoice-*.pdf' | wc -l)
          echo "Rendered $count PDFs"
          [ "$count" -ge 7 ] || { echo "Corpus is incomplete"; exit 1; }
      - name: Cache Mustang CLI
        id: mustang-cache
        uses: actions/cache@v6
        with:
          path: Mustang-CLI-${{ env.MUSTANG_VERSION }}.jar
          key: mustang-cli-${{ env.MUSTANG_VERSION }}-${{ env.MUSTANG_SHA256 }}
      - name: Download Mustang CLI
        if: steps.mustang-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o "Mustang-CLI-$MUSTANG_VERSION.jar" \
            "https://repo1.maven.org/maven2/org/mustangproject/Mustang-CLI/$MUSTANG_VERSION/Mustang-CLI-$MUSTANG_VERSION.jar"
      - name: Verify Mustang CLI checksum
        run: echo "$MUSTANG_SHA256  Mustang-CLI-$MUSTANG_VERSION.jar" | sha256sum -c -
      - name: Validate the corpus with Mustang
        # validateExpectValid exits non-zero as soon as one file is invalid
        run: java -jar "Mustang-CLI-$MUSTANG_VERSION.jar" --action validateExpectValid --directory "$CORPUS_DIR" --disable-file-logging
