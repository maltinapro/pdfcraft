name: Release design package

# Publishes @maltinapro/pdfcraft-design to GitHub Packages when a tag design-vX.Y.Z is pushed
# (the version must match frontend/packages/design/package.json) or manually from a tag/branch.
on:
  push:
    tags:
      - "design-v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: "@maltinapro"
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Check that the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/design-v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./packages/design/package.json').version")"
          if [ "$TAG" != "design-v$version" ]; then
            echo "Tag $TAG does not match packages/design/package.json version $version" >&2
            exit 1
          fi
      - name: Publish
        working-directory: frontend/packages/design
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish
