name: Release images

# Manual only: Actions -> "Release images" -> Run workflow
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (besides the short commit SHA)"
        required: true
        default: latest
      chart_version:
        description: "Helm chart version to publish (SemVer, e.g. 0.1.0)"
        required: true
        default: 0.1.0

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pdfcraft-backend
            context: .
            file: backend/Dockerfile
          - name: pdfcraft-frontend
            context: frontend
            file: frontend/Dockerfile
            # empty = same origin: the browser calls /generate-pdf on the page's own host
            build_args: VITE_API_BASE_URL=
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=sha,format=short
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  chart:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Package and push chart to GHCR (OCI)
        env:
          TAG: ${{ inputs.tag }}
          CHART_VERSION: ${{ inputs.chart_version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          helm lint deploy/helm/pdfcraft -f deploy/helm/pdfcraft/values-demo.yaml
          helm package deploy/helm/pdfcraft --version "$CHART_VERSION" --app-version "$TAG" -d /tmp/chart
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "/tmp/chart/pdfcraft-${CHART_VERSION}.tgz" "oci://ghcr.io/${OWNER}/charts"
