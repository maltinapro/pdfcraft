name: Release images

# Triggered by publishing a GitHub release (tag vX.Y.Z) or manually:
# Actions -> "Release images" -> Run workflow
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (besides the short commit SHA)"
        required: true
        default: latest
      chart_version:
        description: "Helm chart version to publish (SemVer, e.g. 0.1.0)"
        required: true
        default: 0.1.0

env:
  REGISTRY: ghcr.io

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      chart_version: ${{ steps.v.outputs.chart_version }}
      tags: ${{ steps.v.outputs.tags }}
    steps:
      - id: v
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_CHART: ${{ inputs.chart_version }}
        run: |
          if [ "$EVENT" = "release" ]; then
            version="${RELEASE_TAG#v}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "Release tag '$RELEASE_TAG' must look like v1.2.3 (or v1.2.3-rc.1)"; exit 1
            fi
            tag="$version"; chart="$version"
            tags="type=raw,value=$version"
            if [[ "$version" != *-* ]]; then
              tags="$tags"$'\n'"type=raw,value=${version%.*}"
            fi
            if [ "$PRERELEASE" != "true" ]; then
              tags="$tags"$'\n'"type=raw,value=latest"
            fi
          else
            tag="$INPUT_TAG"; chart="$INPUT_CHART"
            tags="type=raw,value=$tag"
          fi
          tags="$tags"$'\n'"type=sha,format=short"
          {
            echo "tag=$tag"
            echo "chart_version=$chart"
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  # The backend is compiled natively per architecture (Rust under QEMU would take hours),
  # pushed by digest and merged into one multi-arch tag afterwards.
  backend:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        run: |
          echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/pdfcraft-backend" >> "$GITHUB_ENV"
          echo "ARCH=${PLATFORM##*/}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=pdfcraft-backend-${{ env.ARCH }}
          cache-to: type=gha,mode=max,scope=pdfcraft-backend-${{ env.ARCH }}
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.ARCH }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  backend-manifest:
    runs-on: ubuntu-latest
    needs: [prepare, backend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/pdfcraft-backend" >> "$GITHUB_ENV"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: ${{ needs.prepare.outputs.tags }}
      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)
      - name: Inspect
        run: docker buildx imagetools inspect "${IMAGE}:${{ needs.prepare.outputs.tag }}"

  # The frontend build stage runs on the build platform (static files are
  # architecture independent); only the nginx base image differs per platform.
  frontend:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/pdfcraft-frontend
          tags: ${{ needs.prepare.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # empty = same origin: the browser calls /v1 on the page's own host
          build-args: VITE_API_BASE_URL=
          cache-from: type=gha,scope=pdfcraft-frontend
          cache-to: type=gha,mode=max,scope=pdfcraft-frontend

  chart:
    runs-on: ubuntu-latest
    needs: [prepare, backend-manifest, frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Package and push chart to GHCR (OCI)
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          CHART_VERSION: ${{ needs.prepare.outputs.chart_version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          helm lint deploy/helm/pdfcraft -f deploy/helm/pdfcraft/values-demo.yaml
          helm package deploy/helm/pdfcraft --version "$CHART_VERSION" --app-version "$TAG" -d /tmp/chart
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "/tmp/chart/pdfcraft-${CHART_VERSION}.tgz" "oci://ghcr.io/${OWNER}/charts"
